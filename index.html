    // -------------------------------------------------------------------------
    // TAB 2: MATCHMAKING (MINI COURT DRAFT), ACTIVE MATCHES & RIWAYAT
    // -------------------------------------------------------------------------
    function renderSlotChip(slot) {
      return `
        <div class="flex flex-wrap items-center justify-between gap-1.5 px-3 py-2 rounded-xl bg-white/95 border border-emerald-200/80 shadow-2xs">
          <div class="min-w-0">
            <div class="text-xs sm:text-sm font-extrabold text-slate-900 truncate">${escapeHTML(slot.name)}</div>
            ${slot.subName ? `<div class="text-[10px] text-slate-500 font-medium truncate">(${escapeHTML(slot.subName)})</div>` : ''}
          </div>
          ${slot.isWildcard ? `
            <span class="px-2 py-0.5 rounded-full bg-amber-100 border border-amber-300 text-amber-900 text-[10px] font-extrabold whitespace-nowrap">
              Wildcard - Poin Tidak Dihitung
            </span>
          ` : ''}
        </div>
      `;
    }

    function renderMiniCourtHeadToHead(slotsA, slotsB, sideALabel, sideBLabel) {
      return `
        <div class="mini-court-surface rounded-2xl p-3.5 sm:p-4">
          <div class="relative z-10 grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-3 items-center">
            <!-- Sisi Lapangan A -->
            <div class="space-y-2 p-1.5">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[#059669]"></span>
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#047857]">${sideALabel}</span>
              </div>
              <div class="space-y-1.5">
                ${slotsA.map(slot => renderSlotChip(slot)).join('')}
              </div>
            </div>

            <!-- Net Tengah & Lencana Kok VS -->
            <div class="relative flex md:flex-col items-center justify-center py-1 md:py-0 md:px-1 self-stretch">
              <div class="md:hidden absolute left-2 right-2 h-1 court-net-horizontal rounded-full"></div>
              <div class="hidden md:block absolute top-1 bottom-1 w-1 court-net-vertical rounded-full"></div>
              ${renderShuttlecockVSBadge()}
            </div>

            <!-- Sisi Lapangan B -->
            <div class="space-y-2 p-1.5">
              <div class="flex items-center md:justify-end gap-1.5">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-teal-700">${sideBLabel}</span>
                <span class="w-2 h-2 rounded-full bg-teal-600"></span>
              </div>
              <div class="space-y-1.5">
                ${slotsB.map(slot => renderSlotChip(slot)).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMatchesTab(derived) {
      const meta = getModeMeta();
      const isOnePerSide = meta.perSide === 1;
      const requiredSlots = meta.requiredSlots;
      const availCount = derived.counts.available;
      const finishedCount = derived.counts.finished;
      const needsWildcardBanner = availCount > 0 && availCount < requiredSlots;

      const manualPool = Array.from(derived.statsMap.values()).filter(st => {
        if (st.status === 'available') return true;
        if (uiState.allowWildcard && st.status === 'finished') return true;
        return false;
      }).sort((a, b) => {
        if (a.status !== b.status) return a.status === 'available' ? -1 : 1;
        if (a.regularPlayed !== b.regularPlayed) return a.regularPlayed - b.regularPlayed;
        return a.entity.name.localeCompare(b.entity.name, 'id');
      });

      const selectedManualIds = new Set(
        (isOnePerSide
          ? [uiState.manualSlots.a1, uiState.manualSlots.b1]
          : [uiState.manualSlots.a1, uiState.manualSlots.a2, uiState.manualSlots.b1, uiState.manualSlots.b2]
        ).filter(Boolean)
      );

      const renderManualSelect = (slotKey, label) => {
        const currentVal = uiState.manualSlots[slotKey] || '';
        return `
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">${label}</label>
            <select
              onchange="window.handleManualSlotChange('${slotKey}', this.value)"
              class="w-full px-3 py-2.5 rounded-xl bg-white border border-[#CFE2D8] focus:border-[#059669] outline-none text-xs sm:text-sm font-semibold text-slate-800"
            >
              <option value="">-- Pilih ${meta.entityNoun} --</option>
              ${manualPool.map(st => {
                const isSelectedHere = st.entity.id === currentVal;
                const isTakenElsewhere = !isSelectedHere && selectedManualIds.has(st.entity.id);
                const wcTag = st.status === 'finished' ? ' [Wildcard]' : ` (${st.regularPlayed}/${state.settings.maxMatches})`;
                return `
                  <option value="${st.entity.id}" ${isSelectedHere ? 'selected' : ''} ${isTakenElsewhere ? 'disabled' : ''}>
                    ${escapeHTML(st.entity.name)}${wcTag}${isTakenElsewhere ? ' — Sudah dipilih' : ''}
                  </option>
                `;
              }).join('')}
            </select>
          </div>
        `;
      };

      let draftHTML = '';
      if (uiState.draftMatch) {
        const mapDraftSlot = (id) => {
          const st = derived.statsMap.get(id);
          return {
            id,
            name: st ? st.entity.name : 'Peserta',
            subName: st && st.entity.teamName && st.entity.player1 && st.entity.player2 ? `${st.entity.player1} / ${st.entity.player2}` : '',
            isWildcard: st ? st.status === 'finished' : false,
          };
        };
        const dA = uiState.draftMatch.teamA.map(mapDraftSlot);
        const dB = uiState.draftMatch.teamB.map(mapDraftSlot);

        draftHTML = `
          <div class="mt-4 rounded-3xl border-2 border-[#059669] bg-white p-4 sm:p-5 space-y-4 shadow-md shadow-emerald-900/10">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-[#059669] text-white text-[11px] font-extrabold uppercase tracking-wider">
                  Draft Match • Siap Dimulai
                </span>
                <span class="text-xs text-slate-500">Belum berjalan — cek susunan sebelum klik Start</span>
              </div>
              <button type="button" onclick="window.clearDraftMatch()" class="text-xs font-bold text-slate-400 hover:text-rose-600 cursor-pointer">
                Hapus Draft
              </button>
            </div>

            ${renderMiniCourtHeadToHead(dA, dB, meta.sideALabel, meta.sideBLabel)}

            <div class="flex flex-col sm:flex-row items-stretch sm:items-end justify-between gap-3 pt-2 border-t border-[#EAF3EE]">
              <div class="w-full sm:w-52">
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Nomor / Nama Lapangan</label>
                <input
                  type="text"
                  value="${escapeHTML(uiState.draftMatch.court)}"
                  oninput="window.updateDraftCourt(this.value)"
                  placeholder="Court 1"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-[#F8FBF9] border border-[#CFE2D8] focus:bg-white focus:border-[#059669] outline-none text-sm font-bold text-slate-900"
                />
              </div>

              <div class="flex flex-wrap items-center gap-2">
                ${uiState.matchmakingMode === 'auto' ? `
                  <button
                    type="button"
                    onclick="window.generateSmartAutoMatch()"
                    class="flex-1 sm:flex-none px-4 py-3 rounded-xl bg-white hover:bg-slate-100 border border-slate-300 text-slate-800 text-xs sm:text-sm font-bold transition cursor-pointer"
                  >
                    ↻ Acak Ulang
                  </button>
                ` : ''}
                <button
                  type="button"
                  onclick="window.startDraftMatch()"
                  class="flex-1 sm:flex-none px-6 py-3 rounded-xl bg-[#059669] hover:bg-[#047857] active:scale-[0.99] text-white text-xs sm:text-sm font-extrabold shadow-md shadow-emerald-700/20 transition cursor-pointer"
                >
                  ▶ Mulai Match (Start)
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <!-- Banner Peringatan Otomatis jika Sisa Peserta Tanggung -->
        ${needsWildcardBanner ? `
          <div class="rounded-2xl border border-amber-300 bg-amber-50 p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs">
            <div class="flex items-start gap-3">
              <svg class="w-5 h-5 text-[#D97706] shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <div class="text-xs sm:text-sm text-amber-950 leading-snug">
                <strong>Sisa ${meta.entityNoun} Tersedia Tanggung (${availCount}/${requiredSlots} slot)!</strong>
                ${finishedCount > 0
                  ? `Aktifkan fitur <strong>Wildcard (Penggenap)</strong> agar ${meta.entityNounLower} yang sudah selesai kuota bisa menggenapi pertandingan tanpa mengubah poin klasemen mereka.`
                  : `Tambahkan ${meta.entityNounLower} baru atau tunggu pertandingan aktif selesai untuk melanjutkan.`}
              </div>
            </div>
            ${!uiState.allowWildcard && finishedCount > 0 ? `
              <button
                type="button"
                onclick="window.toggleWildcardOption(true)"
                class="px-4 py-2 rounded-xl bg-[#D97706] hover:bg-amber-700 text-white text-xs font-extrabold shrink-0 cursor-pointer shadow-sm"
              >
                Aktifkan Wildcard
              </button>
            ` : ''}
          </div>
        ` : ''}

        <!-- PANEL 1: MATCHMAKING PINTAR -->
        <section class="bg-white border border-[#DCEAE3] rounded-3xl p-4 sm:p-5 shadow-xs space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="text-sm sm:text-base font-extrabold text-slate-900">
                Matchmaking Pintar <span class="text-xs font-bold text-[#059669] ml-1">• ${meta.label}</span>
              </h2>
              <p class="text-xs text-slate-500 mt-0.5">
                Tersedia: <strong class="text-[#047857]">${availCount}</strong> • Selesai Kuota: <strong class="text-teal-700">${finishedCount}</strong> • Butuh <strong>${requiredSlots}</strong> slot/match
              </p>
            </div>

            <label class="inline-flex items-center justify-between sm:justify-start gap-2.5 px-3.5 py-2 rounded-xl border cursor-pointer transition ${uiState.allowWildcard ? 'border-amber-400 bg-amber-50' : 'border-[#DCEAE3] bg-[#F8FBF9]'}">
              <span class="text-xs font-bold ${uiState.allowWildcard ? 'text-amber-900' : 'text-slate-700'}">
                Izinkan Pemain/Tim Wildcard
              </span>
              <input
                type="checkbox"
                ${uiState.allowWildcard ? 'checked' : ''}
                onchange="window.toggleWildcardOption(this.checked)"
                class="w-4 h-4 accent-amber-600 rounded cursor-pointer"
              />
            </label>
          </div>

          <!-- Switcher Acak Otomatis vs Pilih Manual -->
          <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-[#EEF5F1] border border-[#DCEAE3]">
            <button
              type="button"
              onclick="window.setMatchmakingMode('auto')"
              class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition cursor-pointer ${uiState.matchmakingMode === 'auto' ? 'bg-[#059669] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}"
            >
              Acak Otomatis
            </button>
            <button
              type="button"
              onclick="window.setMatchmakingMode('manual')"
              class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition cursor-pointer ${uiState.matchmakingMode === 'manual' ? 'bg-[#059669] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}"
            >
              Pilih Manual
            </button>
          </div>

          ${uiState.matchmakingMode === 'auto' ? `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-[#F6FAF8] border border-[#DCEAE3] rounded-2xl p-4">
              <div class="text-xs text-slate-600 leading-relaxed">
                Sistem mendahulukan ${meta.entityNounLower} dengan <strong>jumlah main paling sedikit</strong>, lalu menyeimbangkan lawan sesuai poin klasemen. Hasil tampil di <strong>Draft Match</strong> terlebih dahulu sebelum tombol <strong>Start</strong> ditekan.
              </div>
              <button
                type="button"
                onclick="window.generateSmartAutoMatch()"
                class="px-5 py-3 rounded-xl bg-[#059669] hover:bg-[#047857] text-white text-xs sm:text-sm font-extrabold shadow-sm transition cursor-pointer shrink-0"
              >
                ${uiState.draftMatch ? '↻ Acak Ulang Draft' : '⚡ Acak Otomatis'}
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 bg-[#F6FAF8] border border-[#DCEAE3] rounded-2xl p-4">
              <div class="space-y-2.5">
                <div class="text-xs font-extrabold uppercase tracking-wider text-[#047857]">Susunan ${meta.sideALabel}</div>
                ${renderManualSelect('a1', isOnePerSide ? meta.sideALabel : 'Pemain A1')}
                ${!isOnePerSide ? renderManualSelect('a2', 'Pemain A2') : ''}
              </div>
              <div class="space-y-2.5">
                <div class="text-xs font-extrabold uppercase tracking-wider text-teal-700">Susunan ${meta.sideBLabel}</div>
                ${renderManualSelect('b1', isOnePerSide ? meta.sideBLabel : 'Pemain B1')}
                ${!isOnePerSide ? renderManualSelect('b2', 'Pemain B2') : ''}
              </div>
            </div>
          `}

          ${draftHTML}
        </section>

        <!-- PANEL 2: ACTIVE MATCHES (SEDANG BERLANGSUNG) -->
        <section class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-sm sm:text-base font-extrabold text-slate-900 flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full ${derived.activeList.length > 0 ? 'bg-[#059669] animate-pulse' : 'bg-slate-300'}"></span>
              <span>Lapangan Aktif (${derived.activeList.length})</span>
            </h2>
          </div>

          ${derived.activeList.length === 0 ? `
            <div class="bg-white border border-dashed border-[#BFD8CB] rounded-3xl p-8 text-center">
              <p class="text-sm font-bold text-slate-600">Belum ada pertandingan yang sedang berlangsung di lapangan.</p>
              <p class="text-xs text-slate-400 mt-1">Buat draft match di atas lalu klik <strong>Mulai Match (Start)</strong>.</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              ${derived.activeList.map(match => renderActiveMatchCard(match)).join('')}
            </div>
          `}
        </section>

        <!-- PANEL 3: RIWAYAT PERTANDINGAN (MATCH HISTORY WITH EDIT) -->
        <section class="space-y-3 pt-2">
          <div class="flex items-center justify-between">
            <h2 class="text-sm sm:text-base font-extrabold text-slate-900">
              Riwayat Pertandingan (${derived.historyNewestFirst.length})
            </h2>
            <span class="text-xs text-slate-500">Klik <strong>Edit Match</strong> untuk koreksi skor</span>
          </div>

          ${derived.historyNewestFirst.length === 0 ? `
            <div class="bg-white border border-[#DCEAE3] rounded-3xl p-8 text-center text-xs sm:text-sm text-slate-400">
              Riwayat pertandingan yang sudah selesai akan tampil di sini.
            </div>
          ` : `
            <div class="space-y-3">
              ${derived.historyNewestFirst.map(h => renderHistoryCard(h)).join('')}
            </div>
          `}
        </section>
      `;
    }

    function renderActiveMatchCard(match) {
      const mMeta = getModeMeta(match.mode);
      const evalRes = evaluateMatchScores(match.scores, match.setCount, match.targetScore, match.deuceEnabled);
      const elapsedSec = Math.floor((Date.now() - match.startTime) / 1000);
      const targetVal = match.targetScore || 21;

      return `
        <article class="bg-white border border-[#DCEAE3] rounded-3xl p-4 sm:p-5 shadow-md shadow-emerald-950/5 space-y-4">
          <!-- Header: Court, Match #, Real-time Start HH:MM:SS & Live Timer -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[#EAF3EE]">
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-xl bg-[#059669] text-white text-xs font-extrabold shadow-xs">
                ${escapeHTML(match.court)}
              </span>
              <span class="text-xs font-bold text-slate-500">Match #${match.matchNumber}</span>
              <span class="hidden sm:inline-block px-2 py-0.5 rounded-lg bg-[#EDF7F1] text-[#047857] text-[10px] font-extrabold">
                ${mMeta.mode === 'single' ? '1v1' : '2v2'}
              </span>
            </div>

            <div class="flex items-center gap-2 text-xs font-mono">
              <span class="text-slate-500">Mulai <strong class="text-slate-800">${formatClock(match.startTime, true)}</strong></span>
              <span
                data-timer-start="${match.startTime}"
                class="scoreboard-digits px-2.5 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-[#047857] font-extrabold"
              >${formatDuration(elapsedSec)}</span>
            </div>
          </div>

          <!-- Rule Pills -->
          <div class="flex flex-wrap items-center gap-1.5 text-[11px] font-bold">
            <span class="px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700">${match.setCount} Set${match.setCount === 3 ? ' (Best of 3)' : match.setCount === 2 ? ' (Total Poin)' : ''}</span>
            <span class="px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700">Target ${targetVal} Poin</span>
            <span class="px-2.5 py-0.5 rounded-lg ${match.deuceEnabled ? 'bg-emerald-50 text-[#047857] border border-emerald-200' : 'bg-slate-100 text-slate-500'}">Deuce ${match.deuceEnabled ? 'ON' : 'OFF'}</span>
          </div>

          <!-- Mini Badminton Court Head-to-Head -->
          ${renderMiniCourtHeadToHead(match.teamASlots, match.teamBSlots, mMeta.sideALabel, mMeta.sideBLabel)}

          <!-- Best of 3 Dynamic Banner -->
          ${match.setCount === 3 ? `
            <div
              id="active-bo3-banner-${match.id}"
              class="${(evalRes.setsWonA === 2 || evalRes.setsWonB === 2 || evalRes.needsSet3) ? '' : 'hidden'} px-3 py-2 rounded-xl bg-teal-50 border border-teal-200 text-xs font-bold text-teal-800 text-center"
            >
              ${evalRes.setsWonA === 2 || evalRes.setsWonB === 2
                ? `Match Selesai (2-0) — ${evalRes.setsWonA === 2 ? mMeta.sideALabel : mMeta.sideBLabel} Menang! Set 3 tidak diperlukan.`
                : evalRes.needsSet3
                  ? 'Kedudukan Set 1-1! Rubber Set (Set 3) otomatis dibuka.'
                  : ''}
            </div>
          ` : ''}

          <!-- Papan Skor Per Set (Tombol −, Input, +, dan Tombol Cepat Target Skor) -->
          <div class="space-y-3">
            ${Array.from({ length: match.setCount }).map((_, idx) => {
              const sc = match.scores[idx] || { a: '', b: '' };
              const sr = evalRes.setResults[idx] || { complete: false, valid: false, skipped: false, reason: '' };
              const isHiddenSet3 = match.setCount === 3 && idx === 2 && !evalRes.needsSet3;

              let hintText = `Target ${targetVal} (${match.deuceEnabled ? 'Deuce ON' : 'Deuce OFF'})`;
              let hintClass = 'text-[11px] font-medium text-slate-500 text-right';
              if (sr.complete && sr.valid) {
                const winLbl = sr.winner === 'A' ? mMeta.sideALabel : mMeta.sideBLabel;
                hintText = sr.winner === 'D' ? `✓ Set ${idx + 1} Seri` : `✓ ${winLbl} Menang Set ${idx + 1}`;
                hintClass = 'text-[11px] font-bold text-[#047857] text-right';
              } else if (sr.complete && !sr.valid) {
                hintText = `⚠ ${sr.reason}`;
                hintClass = 'text-[11px] font-bold text-amber-700 text-right';
              }

              return `
                <div id="${idx === 2 ? `active-set3-row-${match.id}` : ''}" class="${isHiddenSet3 ? 'hidden' : ''} rounded-2xl bg-[#F6FAF8] border border-[#DCEAE3] p-3 space-y-2.5">
                  <div class="flex items-center justify-between gap-2">
                    <span class="px-2 py-0.5 rounded-md bg-white border border-[#DCEAE3] text-[11px] font-extrabold uppercase tracking-wider text-slate-700">Set ${idx + 1}</span>
                    <div id="active-set-hint-${match.id}-${idx}" class="${hintClass}">${escapeHTML(hintText)}</div>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <!-- Scoreboard Box Side A -->
                    <div class="bg-white border border-emerald-200 rounded-2xl p-2.5 shadow-2xs space-y-2">
                      <div class="text-[10px] font-extrabold uppercase tracking-wider text-[#047857] text-center">${mMeta.sideALabel}</div>
                      <div class="flex items-center justify-center gap-1.5">
                        <button
                          type="button"
                          onclick="window.stepActiveScore('${match.id}', ${idx}, 'a', -1)"
                          aria-label="Kurangi 1 poin ${mMeta.sideALabel} Set ${idx + 1}"
                          class="w-10 h-11 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 border border-slate-200 text-slate-800 font-black text-lg flex items-center justify-center transition cursor-pointer"
                        >−</button>
                        <input
                          type="number"
                          inputmode="numeric"
                          min="0"
                          max="99"
                          id="active-score-input-${match.id}-${idx}-a"
                          value="${escapeHTML(sc.a)}"
                          oninput="window.handleActiveScoreInput('${match.id}', ${idx}, 'a', this.value)"
                          placeholder="0"
                          aria-label="Skor ${mMeta.sideALabel} Set ${idx + 1}"
                          class="scoreboard-digits w-16 h-11 text-center font-mono text-2xl font-black rounded-xl bg-[#F2F7F4] border-2 border-emerald-300 focus:bg-white focus:border-[#059669] focus:ring-2 focus:ring-emerald-500/20 outline-none text-[#0F172A]"
                        />
                        <button
                          type="button"
                          onclick="window.stepActiveScore('${match.id}', ${idx}, 'a', 1)"
                          aria-label="Tambah 1 poin ${mMeta.sideALabel} Set ${idx + 1}"
                          class="w-10 h-11 rounded-xl bg-emerald-50 hover:bg-emerald-100 active:scale-95 border border-emerald-200 text-[#047857] font-black text-lg flex items-center justify-center transition cursor-pointer"
                        >+</button>
                        <button
                          type="button"
                          onclick="window.setQuickTargetActiveScore('${match.id}', ${idx}, 'a')"
                          title="Isi otomatis skor ${mMeta.sideALabel} menjadi ${targetVal}"
                          aria-label="Isi langsung ${targetVal} untuk ${mMeta.sideALabel} Set ${idx + 1}"
                          class="px-3 h-11 rounded-xl bg-[#059669] hover:bg-[#047857] active:scale-95 text-white font-mono font-extrabold text-sm flex items-center justify-center shadow-xs transition cursor-pointer"
                        >${targetVal}</button>
                      </div>
                    </div>

                    <!-- Scoreboard Box Side B -->
                    <div class="bg-white border border-teal-200 rounded-2xl p-2.5 shadow-2xs space-y-2">
                      <div class="text-[10px] font-extrabold uppercase tracking-wider text-teal-700 text-center">${mMeta.sideBLabel}</div>
                      <div class="flex items-center justify-center gap-1.5">
                        <button
                          type="button"
                          onclick="window.stepActiveScore('${match.id}', ${idx}, 'b', -1)"
                          aria-label="Kurangi 1 poin ${mMeta.sideBLabel} Set ${idx + 1}"
                          class="w-10 h-11 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 border border-slate-200 text-slate-800 font-black text-lg flex items-center justify-center transition cursor-pointer"
                        >−</button>
                        <input
                          type="number"
                          inputmode="numeric"
                          min="0"
                          max="99"
                          id="active-score-input-${match.id}-${idx}-b"
                          value="${escapeHTML(sc.b)}"
                          oninput="window.handleActiveScoreInput('${match.id}', ${idx}, 'b', this.value)"
                          placeholder="0"
                          aria-label="Skor ${mMeta.sideBLabel} Set ${idx + 1}"
                          class="scoreboard-digits w-16 h-11 text-center font-mono text-2xl font-black rounded-xl bg-[#F2F7F4] border-2 border-teal-300 focus:bg-white focus:border-teal-600 focus:ring-2 focus:ring-teal-500/20 outline-none text-[#0F172A]"
                        />
                        <button
                          type="button"
                          onclick="window.stepActiveScore('${match.id}', ${idx}, 'b', 1)"
                          aria-label="Tambah 1 poin ${mMeta.sideBLabel} Set ${idx + 1}"
                          class="w-10 h-11 rounded-xl bg-teal-50 hover:bg-teal-100 active:scale-95 border border-teal-200 text-teal-800 font-black text-lg flex items-center justify-center transition cursor-pointer"
                        >+</button>
                        <button
                          type="button"
                          onclick="window.setQuickTargetActiveScore('${match.id}', ${idx}, 'b')"
                          title="Isi otomatis skor ${mMeta.sideBLabel} menjadi ${targetVal}"
                          aria-label="Isi langsung ${targetVal} untuk ${mMeta.sideBLabel} Set ${idx + 1}"
                          class="px-3 h-11 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-95 text-white font-mono font-extrabold text-sm flex items-center justify-center shadow-xs transition cursor-pointer"
                        >${targetVal}</button>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Live Winner Preview -->
          <div
            id="active-match-preview-${match.id}"
            class="${evalRes.isValidMatch
              ? 'text-xs font-bold text-[#047857] bg-emerald-50 border border-emerald-200 rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2'
              : 'text-xs font-medium text-slate-600 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2'}"
          >
            <span>
              ${evalRes.isValidMatch
                ? `✓ Siap Disimpan: ${evalRes.winner === 'A' ? `${mMeta.sideALabel} Menang` : evalRes.winner === 'B' ? `${mMeta.sideBLabel} Menang` : 'Hasil Seri (Draw)'}`
                : escapeHTML(evalRes.firstError || 'Masukkan skor yang sah untuk menyelesaikan match.')}
            </span>
            <span class="scoreboard-digits font-mono font-extrabold text-slate-800">${evalRes.totalA} - ${evalRes.totalB}</span>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row gap-2.5 pt-1">
            <button
              type="button"
              onclick="window.submitActiveMatchScore('${match.id}')"
              class="flex-1 py-3 px-4 rounded-xl bg-[#059669] hover:bg-[#047857] active:scale-[0.99] text-white text-xs sm:text-sm font-extrabold shadow-sm transition cursor-pointer"
            >
              ✓ Simpan Skor &amp; Selesai
            </button>
            <button
              type="button"
              onclick="window.confirmCancelActiveMatch('${match.id}')"
              class="py-3 px-4 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 text-xs sm:text-sm font-bold transition cursor-pointer"
            >
              WO / Batalkan Match
            </button>
          </div>
        </article>
      `;
    }

    function renderHistoryCard(h) {
      const mMeta = getModeMeta(h.mode);
      const durSec = Math.max(1, Math.floor((h.endTime - h.startTime) / 1000));
      const setsBadge = h.sets.map((s, i) => `Set ${i + 1}: ${s.a}-${s.b}`).join('  •  ');

      const renderHistTeam = (slots, isWinner, label, accent) => `
        <div class="rounded-2xl p-3 border ${isWinner ? 'bg-emerald-50/85 border-emerald-300' : 'bg-[#F8FBF9] border-[#DCEAE3]'}">
          <div class="flex items-center justify-between gap-1 mb-1">
            <span class="text-[10px] font-extrabold uppercase tracking-wider ${accent}">${label}</span>
            ${isWinner ? `<span class="text-[10px] font-extrabold text-[#047857]">★ MENANG</span>` : ''}
          </div>
          <div class="space-y-1">
            ${slots.map(s => `
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs sm:text-sm font-bold text-slate-900">${escapeHTML(s.name)}</span>
                ${s.isWildcard ? `
                  <span class="px-1.5 py-0.5 rounded-md bg-amber-100 border border-amber-300 text-amber-900 text-[9px] font-extrabold">
                    Wildcard
                  </span>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;

      return `
        <article class="bg-white border border-[#DCEAE3] rounded-2xl p-4 shadow-2xs space-y-3 hover:border-emerald-300 transition">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2 text-xs">
              <span class="px-2.5 py-0.5 rounded-lg bg-[#EDF7F1] border border-[#C6E5D6] font-extrabold text-[#047857]">
                Match #${h.matchNumber}
              </span>
              <span class="font-bold text-slate-800">${escapeHTML(h.court)}</span>
              <span class="text-slate-300">•</span>
              <span class="font-mono text-slate-500">${formatClock(h.startTime, true)} – ${formatClock(h.endTime, true)} (${formatDuration(durSec)})</span>
            </div>

            <button
              type="button"
              onclick="window.openEditHistoryModal('${h.id}')"
              class="px-3 py-1.5 rounded-xl bg-[#F6FAF8] hover:bg-emerald-50 border border-[#DCEAE3] hover:border-emerald-300 text-slate-700 hover:text-[#047857] text-xs font-bold transition cursor-pointer"
            >
              ✎ Edit Match
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-2.5 items-center">
            ${renderHistTeam(h.teamASlots, h.winner === 'A', mMeta.sideALabel, 'text-[#047857]')}

            <div class="text-center px-4 py-2 rounded-2xl bg-[#F6FAF8] border border-[#DCEAE3]">
              <div class="scoreboard-digits font-mono text-xl font-black text-slate-900">
                <span class="${h.winner === 'A' ? 'text-[#059669]' : 'text-slate-700'}">${h.totalA}</span>
                <span class="text-slate-300 mx-1">-</span>
                <span class="${h.winner === 'B' ? 'text-[#059669]' : 'text-slate-700'}">${h.totalB}</span>
              </div>
              <div class="text-[10px] font-mono text-slate-500 mt-0.5">${escapeHTML(setsBadge)}</div>
              ${h.winner === 'D' ? `<div class="text-[10px] font-extrabold text-amber-700 mt-0.5">SERI (DRAW)</div>` : ''}
            </div>

            ${renderHistTeam(h.teamBSlots, h.winner === 'B', mMeta.sideBLabel, 'text-teal-700')}
          </div>
        </article>
      `;
    }

    // -------------------------------------------------------------------------
    // TAB 3: PODIUM JUARA (COURT BASE + LARGE NAMES & MEDALS) & KLASEMEN LIVE
    // -------------------------------------------------------------------------
    function renderGrandMedalSVG(rank) {
      if (rank === 1) {
        return `
          <div class="relative flex items-center justify-center my-2.5">
            <div class="absolute w-36 h-36 sm:w-40 sm:h-40 rounded-full aura-gold pointer-events-none"></div>

            <svg class="sparkle-1 absolute -top-2 -left-4 w-5 h-5 text-amber-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
            <svg class="sparkle-2 absolute top-1 -right-4 w-4 h-4 text-yellow-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
            <svg class="sparkle-3 absolute -bottom-1 -left-3 w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
            <svg class="sparkle-4 absolute bottom-2 -right-3 w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>

            <svg class="relative z-10 w-28 h-28 sm:w-32 sm:h-32 animate-float-gold drop-shadow-[0_14px_20px_rgba(217,119,6,0.36)]" viewBox="0 0 120 120" fill="none">
              <defs>
                <linearGradient id="goldMedalOuterB" x1="20" y1="30" x2="100" y2="112" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FEF08A"/>
                  <stop offset="35%" stop-color="#F59E0B"/>
                  <stop offset="75%" stop-color="#D97706"/>
                  <stop offset="100%" stop-color="#92400E"/>
                </linearGradient>
                <linearGradient id="goldMedalInnerB" x1="30" y1="40" x2="90" y2="102" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FFFBEB"/>
                  <stop offset="45%" stop-color="#FBBF24"/>
                  <stop offset="100%" stop-color="#B45309"/>
                </linearGradient>
                <linearGradient id="goldCrownB" x1="42" y1="8" x2="78" y2="26" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FDE047"/>
                  <stop offset="100%" stop-color="#D97706"/>
                </linearGradient>
              </defs>
              <path d="M44 26L40 12L51 18L60 7L69 18L80 12L76 26H44Z" fill="url(#goldCrownB)" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M36 26L52 44H60L46 26H36Z" fill="#047857"/>
              <path d="M84 26L68 44H60L74 26H84Z" fill="#059669"/>
              <path d="M21 68C19 83 28 97 42 105" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/>
              <path d="M99 68C101 83 92 97 78 105" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/>
              <circle cx="60" cy="72" r="34" fill="url(#goldMedalOuterB)" stroke="#FEF3C7" stroke-width="3"/>
              <circle cx="60" cy="72" r="26.5" fill="url(#goldMedalInnerB)" stroke="#FDE68A" stroke-width="1.8"/>
              <path d="M60 49L64.5 59.5L76 60.8L67.3 68.4L69.8 79.6L60 73.8L50.2 79.6L52.7 68.4L44 60.8L55.5 59.5L60 49Z" fill="#FFFFFF" fill-opacity="0.38"/>
              <text x="60" y="81" text-anchor="middle" fill="#451A03" font-family="Inter, sans-serif" font-weight="900" font-size="28">1</text>
            </svg>
          </div>
        `;
      }

      if (rank === 2) {
        return `
          <div class="relative flex items-center justify-center my-2">
            <div class="absolute w-28 h-28 rounded-full aura-silver pointer-events-none"></div>
            <svg class="sparkle-2 absolute top-0 -right-2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
            <svg class="relative z-10 w-24 h-24 sm:w-26 sm:h-26 animate-float-silver drop-shadow-[0_10px_16px_rgba(100,116,139,0.34)]" viewBox="0 0 100 100" fill="none">
              <defs>
                <linearGradient id="silverOuterB" x1="18" y1="26" x2="82" y2="92" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#F8FAFC"/>
                  <stop offset="45%" stop-color="#CBD5E1"/>
                  <stop offset="100%" stop-color="#475569"/>
                </linearGradient>
                <linearGradient id="silverInnerB" x1="25" y1="35" x2="75" y2="85" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FFFFFF"/>
                  <stop offset="60%" stop-color="#94A3B8"/>
                  <stop offset="100%" stop-color="#64748B"/>
                </linearGradient>
              </defs>
              <path d="M30 12L44 35H52L39 12H30Z" fill="#047857"/>
              <path d="M70 12L56 35H48L61 12H70Z" fill="#10B981"/>
              <circle cx="50" cy="60" r="29" fill="url(#silverOuterB)" stroke="#FFFFFF" stroke-width="2.5"/>
              <circle cx="50" cy="60" r="22" fill="url(#silverInnerB)" stroke="#E2E8F0" stroke-width="1.5"/>
              <text x="50" y="69" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-weight="900" font-size="25">2</text>
            </svg>
          </div>
        `;
      }

      return `
        <div class="relative flex items-center justify-center my-2">
          <div class="absolute w-28 h-28 rounded-full aura-bronze pointer-events-none"></div>
          <svg class="sparkle-3 absolute top-0 -left-2 w-4 h-4 text-orange-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
          <svg class="relative z-10 w-24 h-24 sm:w-26 sm:h-26 animate-float-bronze drop-shadow-[0_10px_16px_rgba(194,65,12,0.34)]" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="bronzeOuterB" x1="18" y1="26" x2="82" y2="92" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FED7AA"/>
                <stop offset="45%" stop-color="#EA580C"/>
                <stop offset="100%" stop-color="#7C2D12"/>
              </linearGradient>
              <linearGradient id="bronzeInnerB" x1="25" y1="35" x2="75" y2="85" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFEDD5"/>
                <stop offset="55%" stop-color="#FB923C"/>
                <stop offset="100%" stop-color="#9A3412"/>
              </linearGradient>
            </defs>
            <path d="M30 12L44 35H52L39 12H30Z" fill="#0F766E"/>
            <path d="M70 12L56 35H48L61 12H70Z" fill="#14B8A6"/>
            <circle cx="50" cy="60" r="29" fill="url(#bronzeOuterB)" stroke="#FFEDD5" stroke-width="2.5"/>
            <circle cx="50" cy="60" r="22" fill="url(#bronzeInnerB)" stroke="#FDBA74" stroke-width="1.5"/>
            <text x="50" y="69" text-anchor="middle" fill="#431407" font-family="Inter, sans-serif" font-weight="900" font-size="25">3</text>
          </svg>
        </div>
      `;
    }

    function renderSmallRankBadge(rank) {
      if (rank === 1) {
        return `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-br from-yellow-300 to-amber-500 text-amber-950 font-black text-xs shadow-sm">1</span>`;
      }
      if (rank === 2) {
        return `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-br from-slate-200 to-slate-400 text-slate-900 font-black text-xs shadow-sm">2</span>`;
      }
      if (rank === 3) {
        return `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-br from-orange-300 to-orange-500 text-orange-950 font-black text-xs shadow-sm">3</span>`;
      }
      return `<span class="font-mono font-bold text-slate-500 text-xs">${rank}</span>`;
    }

    function renderLeaderboardTab(derived) {
      const ranked = derived.leaderboard;
      const meta = getModeMeta();
      const maxM = state.settings.maxMatches;

      if (ranked.length === 0) {
        return `
          <div class="bg-white border border-[#DCEAE3] rounded-3xl p-12 text-center shadow-xs space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-amber-50 border border-amber-200 text-[#D97706] flex items-center justify-center mx-auto">
              <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            </div>
            <h2 class="text-base font-extrabold text-slate-900">Klasemen Live Masih Kosong</h2>
            <p class="text-xs text-slate-500 max-w-md mx-auto">
              Tambahkan ${meta.entityNounLower} di Tab 1 dan selesaikan pertandingan pertama untuk melihat Podium Juara dan Klasemen Live!
            </p>
          </div>
        `;
      }

      const top1 = ranked[0] || null;
      const top2 = ranked[1] || null;
      const top3 = ranked[2] || null;

      const podiumItems = [
        {
          st: top2,
          rank: 2,
          orderCls: 'order-2 sm:order-1 sm:mt-8',
          cardCls: 'champion-shimmer-card border-2 border-slate-300 bg-gradient-to-b from-slate-100 via-white to-white shadow-lg shadow-slate-300/40',
          pillCls: 'bg-slate-700 text-white',
          nameCls: 'text-xl sm:text-2xl font-extrabold text-slate-900',
          title: 'Juara 2 • Perak'
        },
        {
          st: top1,
          rank: 1,
          orderCls: 'order-1 sm:order-2',
          cardCls: 'champion-shimmer-card border-2 border-amber-400 bg-gradient-to-b from-amber-100/80 via-amber-50/40 to-white shadow-xl shadow-amber-400/25 ring-2 ring-amber-200/70 sm:-translate-y-2',
          pillCls: 'bg-gradient-to-r from-[#D97706] to-amber-500 text-white shadow-sm',
          nameCls: 'text-2xl sm:text-3xl font-black text-slate-950 tracking-tight',
          title: 'Juara 1 • Emas'
        },
        {
          st: top3,
          rank: 3,
          orderCls: 'order-3 sm:order-3 sm:mt-10',
          cardCls: 'champion-shimmer-card border-2 border-orange-300 bg-gradient-to-b from-orange-100/70 via-white to-white shadow-lg shadow-orange-300/30',
          pillCls: 'bg-orange-600 text-white',
          nameCls: 'text-xl sm:text-2xl font-extrabold text-slate-900',
          title: 'Juara 3 • Perunggu'
        },
      ].filter(p => p.st !== null);

      return `
        <!-- GRAND CHAMPIONSHIP PODIUM (DASAR GARIS LAPANGAN + NAMA & MEDALI BESAR) -->
        <section class="podium-court-stage rounded-3xl p-4 sm:p-6 pb-8">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
            ${podiumItems.map(({ st, rank, orderCls, cardCls, pillCls, nameCls, title }) => {
              const pdStr = st.pd > 0 ? `+${st.pd}` : `${st.pd}`;
              const hasSub = st.entity.teamName && st.entity.player1 && st.entity.player2;

              return `
                <div class="${orderCls} rounded-3xl ${cardCls} p-5 sm:p-6 flex flex-col items-center text-center transition-transform duration-300 hover:-translate-y-1.5">
                  <span class="relative z-10 px-3.5 py-1 rounded-full text-[11px] font-black uppercase tracking-wider ${pillCls}">
                    ${title}
                  </span>

                  ${renderGrandMedalSVG(rank)}

                  <div class="relative z-10 w-full mt-1">
                    <div class="${nameCls} leading-tight break-words px-1">
                      ${escapeHTML(st.entity.name)}
                    </div>
                    ${hasSub ? `
                      <div class="text-xs sm:text-sm text-slate-500 font-semibold mt-1">
                        (${escapeHTML(st.entity.player1)} / ${escapeHTML(st.entity.player2)})
                      </div>
                    ` : ''}
                  </div>

                  <div class="relative z-10 w-full grid grid-cols-3 gap-2 mt-4 pt-3.5 border-t border-slate-200/80">
                    <div class="rounded-xl bg-[#F6FAF8] border border-[#DCEAE3] py-2 px-1">
                      <div class="text-[10px] font-bold uppercase text-slate-400">Menang</div>
                      <div class="scoreboard-digits text-sm sm:text-base font-black font-mono text-[#047857] mt-0.5">${st.wins}M</div>
                    </div>
                    <div class="rounded-xl bg-[#F6FAF8] border border-[#DCEAE3] py-2 px-1">
                      <div class="text-[10px] font-bold uppercase text-slate-400">Selisih</div>
                      <div class="scoreboard-digits text-sm sm:text-base font-black font-mono ${st.pd > 0 ? 'text-[#059669]' : st.pd < 0 ? 'text-rose-600' : 'text-slate-600'} mt-0.5">${pdStr}</div>
                    </div>
                    <div class="rounded-xl bg-[#F6FAF8] border border-[#DCEAE3] py-2 px-1">
                      <div class="text-[10px] font-bold uppercase text-slate-400">Poin</div>
                      <div class="scoreboard-digits text-sm sm:text-base font-black font-mono text-[#D97706] mt-0.5">${st.pf}</div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </section>

        <!-- TABEL KLASEMEN LENGKAP (TANPA KOLOM STATUS) -->
        <section class="bg-white border border-[#DCEAE3] rounded-3xl overflow-hidden shadow-xs">
          <div class="p-4 sm:p-5 border-b border-[#EAF3EE]">
            <h2 class="text-sm sm:text-base font-extrabold text-slate-900">Tabel Klasemen Live</h2>
            <p class="text-xs text-slate-500 mt-0.5">
              Urutan tie-breaker: <strong class="text-slate-700">1. Menang (M)</strong> &rarr; <strong class="text-slate-700">2. Selisih Poin (PD)</strong> &rarr; <strong class="text-slate-700">3. Total Poin Masuk (PF)</strong>. Laga Wildcard tidak dihitung.
            </p>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#F4F9F6] border-b border-[#DCEAE3] text-[11px] font-extrabold uppercase tracking-wider text-slate-500">
                  <th class="py-3 px-3 sm:px-4 text-center w-14">Rank</th>
                  <th class="py-3 px-3 sm:px-4">Nama ${meta.entityNoun}</th>
                  <th class="py-3 px-2.5 sm:px-3 text-center">Main</th>
                  <th class="py-3 px-2 sm:px-2.5 text-center text-[#047857]" title="Menang">M</th>
                  <th class="py-3 px-2 sm:px-2.5 text-center text-slate-500" title="Seri">S</th>
                  <th class="py-3 px-2 sm:px-2.5 text-center text-rose-600" title="Kalah">K</th>
                  <th class="py-3 px-2 sm:px-2.5 text-center" title="Poin Masuk">PF</th>
                  <th class="py-3 px-2 sm:px-2.5 text-center" title="Poin Kemasukan">PA</th>
                  <th class="py-3 px-3 sm:px-4 text-center" title="Selisih Poin">PD</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#EAF3EE] text-xs sm:text-sm">
                ${ranked.map((st, idx) => {
                  const rank = idx + 1;
                  const pdStr = st.pd > 0 ? `+${st.pd}` : `${st.pd}`;
                  const pdCls = st.pd > 0
                    ? 'bg-emerald-50 text-[#047857] border border-emerald-200'
                    : st.pd < 0
                      ? 'bg-rose-50 text-rose-700 border border-rose-200'
                      : 'bg-slate-100 text-slate-600 border border-slate-200';
                  const hasSub = st.entity.teamName && st.entity.player1 && st.entity.player2;

                  return `
                    <tr class="hover:bg-[#F6FAF8] transition ${rank === 1 ? 'bg-amber-50/45' : ''}">
                      <td class="py-3 px-3 sm:px-4 text-center whitespace-nowrap">
                        ${renderSmallRankBadge(rank)}
                      </td>
                      <td class="py-3 px-3 sm:px-4">
                        <div class="font-bold text-slate-900">${escapeHTML(st.entity.name)}</div>
                        ${hasSub ? `
                          <div class="text-[11px] text-slate-500">(${escapeHTML(st.entity.player1)} / ${escapeHTML(st.entity.player2)})</div>
                        ` : ''}
                      </td>
                      <td class="py-3 px-2.5 sm:px-3 text-center whitespace-nowrap">
                        <span class="scoreboard-digits font-mono font-bold text-slate-800">${st.regularPlayed}/${maxM}</span>
                        ${st.wildcardPlayed > 0 ? `
                          <span class="ml-1 inline-block px-1.5 py-0.5 rounded bg-amber-100 border border-amber-300 text-amber-800 text-[10px] font-extrabold">
                            +${st.wildcardPlayed} WC
                          </span>
                        ` : ''}
                      </td>
                      <td class="scoreboard-digits py-3 px-2 sm:px-2.5 text-center font-mono font-extrabold text-[#047857]">${st.wins}</td>
                      <td class="scoreboard-digits py-3 px-2 sm:px-2.5 text-center font-mono font-bold text-slate-500">${st.draws}</td>
                      <td class="scoreboard-digits py-3 px-2 sm:px-2.5 text-center font-mono font-bold text-rose-600">${st.losses}</td>
                      <td class="scoreboard-digits py-3 px-2 sm:px-2.5 text-center font-mono font-semibold text-slate-800">${st.pf}</td>
                      <td class="scoreboard-digits py-3 px-2 sm:px-2.5 text-center font-mono font-semibold text-slate-500">${st.pa}</td>
                      <td class="py-3 px-3 sm:px-4 text-center whitespace-nowrap">
                        <span class="scoreboard-digits inline-block min-w-[44px] px-2 py-0.5 rounded-lg font-mono font-extrabold text-xs ${pdCls}">
                          ${pdStr}
                        </span>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderAll() {
      const derived = recalculateStats();
      renderNav(derived);

      const main = document.getElementById('app-main');
      if (!main) return;

      if (uiState.activeTab === 'participants') {
        main.innerHTML = renderParticipantsTab(derived);
      } else if (uiState.activeTab === 'matches') {
        main.innerHTML = renderMatchesTab(derived);
      } else {
        main.innerHTML = renderLeaderboardTab(derived);
      }
    }

    // =========================================================================
    // 14. LIVE ACTIVE MATCH TIMER LOOP
    // =========================================================================
    setInterval(() => {
      if (uiState.activeTab !== 'matches' || state.activeMatches.length === 0) return;
      const now = Date.now();
      document.querySelectorAll('[data-timer-start]').forEach(el => {
        const startTs = Number(el.getAttribute('data-timer-start'));
        if (startTs > 0) {
          el.textContent = formatDuration((now - startTs) / 1000);
        }
      });
    }, 1000);

    // =========================================================================
    // 15. BOOTSTRAP APPLICATION
    // =========================================================================
    function initApp() {
      loadLocalMirror(currentRoomId);
      updateCloudBadgeUI();
      renderAll();
      initFirebaseCloud();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>

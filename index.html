<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mabar Badminton Pro — Fun Match & Matchmaking System</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    /* =====================================================================
       BADMINTON COURT LIGHT THEME — CLEAN, SPORTY & HIGH LEGIBILITY
       ===================================================================== */
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F2F7F4;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Pola garis lapangan badminton halus pada latar belakang halaman */
    .badminton-page-bg {
      background-color: #F2F7F4;
      background-image:
        linear-gradient(to right, rgba(5, 150, 105, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(5, 150, 105, 0.045) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.07), transparent 55%);
      background-size: 64px 64px, 64px 64px, 100% 380px;
    }

    /* Header terang dengan pola garis lapangan & aksen jaring net tipis */
    .badminton-arena-header {
      background-color: #FFFFFF;
      background-image:
        radial-gradient(circle at 12% 50%, rgba(5, 150, 105, 0.09), transparent 46%),
        radial-gradient(circle at 88% 35%, rgba(217, 119, 6, 0.07), transparent 44%),
        linear-gradient(to right, rgba(5, 150, 105, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(5, 150, 105, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }

    /* Aksen pita jaring net badminton tipis di bagian atas header */
    .badminton-net-strip {
      height: 5px;
      background-color: #059669;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.35) 0px,
          rgba(255, 255, 255, 0.35) 1px,
          transparent 1px,
          transparent 8px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.25) 0px,
          rgba(255, 255, 255, 0.25) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    /* Mini Lapangan Badminton untuk Head-to-Head Draft & Active Match */
    .mini-court-surface {
      position: relative;
      background: linear-gradient(135deg, #E8F6EE 0%, #EFFAF4 50%, #E6F4EC 100%);
      border: 1.5px solid #BFE3D0;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85);
    }
    .mini-court-surface::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.92);
      border-radius: 12px;
      pointer-events: none;
    }

    /* Garis jaring net vertikal (desktop) & horizontal (mobile) di tengah mini court */
    .court-net-vertical {
      background-image: repeating-linear-gradient(
        0deg,
        rgba(4, 120, 87, 0.42) 0px,
        rgba(4, 120, 87, 0.42) 2px,
        transparent 2px,
        transparent 6px
      );
    }
    .court-net-horizontal {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(4, 120, 87, 0.42) 0px,
        rgba(4, 120, 87, 0.42) 2px,
        transparent 2px,
        transparent 6px
      );
    }

    /* Papan skor angka tabular tegas */
    .scoreboard-digits {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    /* Dasar garis lapangan pada Podium Juara */
    .podium-court-stage {
      position: relative;
      background: linear-gradient(180deg, rgba(232, 246, 238, 0.45) 0%, rgba(220, 234, 227, 0.65) 100%);
      border: 1.5px solid #CFE5D9;
    }
    .podium-court-stage::after {
      content: '';
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95) 15%, rgba(255, 255, 255, 0.95) 85%, transparent);
      border-radius: 9999px;
      pointer-events: none;
    }

    /* Hilangkan spinner bawaan input number */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* Animasi Toast & Modal */
    @keyframes slideInToast {
      from { transform: translateY(-14px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes modalPop {
      from { transform: scale(0.96) translateY(10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-toast {
      animation: slideInToast 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-modal {
      animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Animasi Podium Medali Juara */
    @keyframes floatMedal {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }
    @keyframes pulseAuraGold {
      0%, 100% { opacity: 0.48; transform: scale(0.94); }
      50% { opacity: 0.86; transform: scale(1.1); }
    }
    @keyframes pulseAuraSoft {
      0%, 100% { opacity: 0.34; transform: scale(0.95); }
      50% { opacity: 0.68; transform: scale(1.07); }
    }
    @keyframes shimmerSweepLight {
      0% { transform: translateX(-160%) skewX(-22deg); }
      55% { transform: translateX(260%) skewX(-22deg); }
      100% { transform: translateX(260%) skewX(-22deg); }
    }
    @keyframes twinkleStar {
      0%, 100% { opacity: 0.28; transform: scale(0.75) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.22) rotate(22deg); }
    }

    .animate-float-gold {
      animation: floatMedal 3.2s ease-in-out infinite;
    }
    .animate-float-silver {
      animation: floatMedal 3.6s ease-in-out 0.4s infinite;
    }
    .animate-float-bronze {
      animation: floatMedal 3.9s ease-in-out 0.8s infinite;
    }
    .aura-gold {
      animation: pulseAuraGold 3s ease-in-out infinite;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.4) 0%, rgba(251, 191, 36, 0.16) 50%, transparent 74%);
    }
    .aura-silver {
      animation: pulseAuraSoft 3.4s ease-in-out infinite;
      background: radial-gradient(circle, rgba(148, 163, 184, 0.38) 0%, rgba(203, 213, 225, 0.14) 52%, transparent 74%);
    }
    .aura-bronze {
      animation: pulseAuraSoft 3.6s ease-in-out infinite;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.32) 0%, rgba(251, 146, 60, 0.12) 52%, transparent 74%);
    }
    .champion-shimmer-card {
      position: relative;
      overflow: hidden;
    }
    .champion-shimmer-card::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), rgba(254, 243, 199, 0.5), transparent);
      animation: shimmerSweepLight 4.6s ease-in-out infinite;
      pointer-events: none;
    }
    .sparkle-1 { animation: twinkleStar 2.1s ease-in-out infinite; }
    .sparkle-2 { animation: twinkleStar 2.6s ease-in-out 0.6s infinite; }
    .sparkle-3 { animation: twinkleStar 2.0s ease-in-out 1.2s infinite; }
    .sparkle-4 { animation: twinkleStar 2.8s ease-in-out 0.3s infinite; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #E8F1EC;
    }
    ::-webkit-scrollbar-thumb {
      background: #B8D4C5;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #88B59E;
    }
  </style>
</head>
<body class="min-h-screen badminton-page-bg text-[#0F172A] flex flex-col selection:bg-emerald-100 selection:text-emerald-900">

          <span id="header-room-code" class="font-mono font-extrabold tracking-wider text-[#047857]">MABAR-UTAMA</span>
        </button>

  <!-- ===================================================================== -->
  <!-- STICKY ICON-ONLY NAVIGATION BAR (BADMINTON ICONS, NO TEXT LABELS!)    -->
  <!-- ===================================================================== -->
  <nav class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#DCEAE3] shadow-xs" aria-label="Navigasi Utama">
    <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2">
      <div class="grid grid-cols-3 gap-2 sm:gap-3">

        >
          <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- Raket Badminton -->
            <ellipse cx="14.5" cy="9.5" rx="5" ry="6.6" transform="rotate(45 14.5 9.5)"/>
            <path d="m11.2 6.2 6.6 6.6" stroke-width="1.4"/>

            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>

  <!-- ===================================================================== -->
  <!-- MAIN CONTENT AREA                                                     -->
  <!-- ===================================================================== -->
  <main id="app-main" class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 py-5 pb-16 space-y-5">

  </main>

  <!-- Hidden File Input untuk Import JSON -->

  <!-- ===================================================================== -->
  <!-- APPLICATION LOGIC (ES6+ MODULE + FIREBASE FIRESTORE CLOUD SYNC)       -->
  <!-- ===================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // 1. CONSTANTS, ENVIRONMENT & DEFAULT STATE
    // =========================================================================
    const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'badminton-mabar-pro';
    const FIREBASE_CONFIG = typeof __firebase_config !== 'undefined'
      ? (typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config)
      : null;
    const INITIAL_AUTH_TOKEN = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    const VALID_MODES = ['individual', 'fixed_pair', 'single'];

    const DEFAULT_SETTINGS = {
      mode: 'individual', // 'individual' (Ganda Acak) | 'fixed_pair' (Ganda Tetap) | 'single' (Tunggal 1v1)
      maxMatches: 3,      // Kuota reguler default 3x (min 1, maks 20)
      setCount: 2,        // 1 | 2 | 3
      targetScore: 21,    // 11 | 15 | 21 | 30 (default 21)
      deuceEnabled: false,// Toggle Deuce: OFF / ON
    };

    // Source of Truth State — Statistik & Status Wildcard SELALU direkalkulasi dinamis dari matchHistory
    let state = {
      settings: { ...DEFAULT_SETTINGS },
      entities: [],       // [{ id, name, teamName, player1, player2, isLeft, createdAt }]
      activeMatches: [],  // [{ id, matchNumber, court, mode, setCount, targetScore, deuceEnabled, teamA:[id], teamB:[id], scores:[{a:'',b:''}], startTime }]
      matchHistory: [],   // [{ id, matchNumber, court, mode, setCount, targetScore, deuceEnabled, teamA:[id], teamB:[id], sets:[{a,b}], startTime, endTime }]
      matchCounter: 1,
      updatedAt: 0,
    };

    // Local UI State
    const uiState = {
      activeTab: 'participants', // 'participants' | 'matches' | 'leaderboard'
      allowWildcard: false,
      matchmakingMode: 'auto',   // 'auto' | 'manual'
      draftMatch: null,          // { teamA: [id...], teamB: [id...], court: 'Court 1', source: 'auto'|'manual' }
      manualSlots: { a1: '', a2: '', b1: '', b2: '' },
      searchQuery: '',
      lastAutoSignature: '',
    };

    // Firebase Runtime Variables
    let db = null;
    let auth = null;
    let currentUser = null;
    let firebaseReady = false;
    let unsubscribeRoom = null;
    let cloudSyncStatus = 'connecting'; // 'connecting' | 'online' | 'syncing' | 'offline'
    let syncTimer = null;

    function getInitialRoomCode() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlRoom = params.get('room');
        if (urlRoom && /^[A-Za-z0-9_-]{3,24}$/.test(urlRoom.trim())) {
          return urlRoom.trim().toUpperCase();
        }
        const hashRoom = window.location.hash.replace(/^#room=/i, '').trim();
        if (hashRoom && /^[A-Za-z0-9_-]{3,24}$/.test(hashRoom)) {
          return hashRoom.toUpperCase();
        }
        const saved = localStorage.getItem('mabar_badminton_room_code');
        if (saved && /^[A-Za-z0-9_-]{3,24}$/.test(saved)) {
          return saved.toUpperCase();
        }
      } catch (_) {}
      return 'MABAR-UTAMA';
    }

    let currentRoomId = getInitialRoomCode();

    function getLocalStorageKey(roomId = currentRoomId) {
      return `mabar_badminton_pro_v4_${roomId}`;
    }

    // =========================================================================
    // 2. MODE LABELS & UTILITY HELPERS
    // =========================================================================
    function getModeMeta(mode = state.settings.mode) {
      if (mode === 'fixed_pair') {
        return {
          mode: 'fixed_pair',
          label: 'Ganda Tetap (Pair)',
          entityNoun: 'Pasangan',
          entityNounLower: 'pasangan',
          sideALabel: 'Tim A',
          sideBLabel: 'Tim B',
          sidePrefix: 'Tim',
          requiredSlots: 2,
          perSide: 1,
        };
      }
      if (mode === 'single') {
        return {
          mode: 'single',
          label: 'Tunggal (Single)',
          entityNoun: 'Pemain',
          entityNounLower: 'pemain',
          sideALabel: 'Pemain A',
          sideBLabel: 'Pemain B',
          sidePrefix: 'Pemain',
          requiredSlots: 2,
          perSide: 1,
        };
      }
      return {
        mode: 'individual',
        label: 'Ganda Acak (Mix)',
        entityNoun: 'Peserta',
        entityNounLower: 'peserta',
        sideALabel: 'Tim A',
        sideBLabel: 'Tim B',
        sidePrefix: 'Tim',
        requiredSlots: 4,
        perSide: 2,
      };
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function generateId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
    }

    function formatClock(ts, includeSeconds = true) {
      if (!ts) return '--:--:--';
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      if (!includeSeconds) return `${hh}:${mm}`;
      const ss = String(d.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function formatDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds || 0));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Iframe-safe clipboard copy
    function copyTextToClipboard(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return ok;
      } catch (_) {
        return false;
      }
    }

    // =========================================================================
    // 3. STATE SANITIZATION, STORAGE & FIREBASE FIRESTORE CLOUD SYNC
    // =========================================================================
    function sanitizeState(raw) {
      const s = raw && typeof raw === 'object' ? raw : {};
      const rawSettings = s.settings && typeof s.settings === 'object' ? s.settings : {};

      const mode = VALID_MODES.includes(rawSettings.mode) ? rawSettings.mode : 'individual';
      const maxMatches = Math.max(1, Math.min(20, parseInt(rawSettings.maxMatches, 10) || 3));
      const setCount = [1, 2, 3].includes(Number(rawSettings.setCount)) ? Number(rawSettings.setCount) : 2;
      const targetScore = Math.max(5, Math.min(99, parseInt(rawSettings.targetScore, 10) || 21));
      const deuceEnabled = rawSettings.deuceEnabled !== undefined ? Boolean(rawSettings.deuceEnabled) : false;

      const entities = Array.isArray(s.entities)
        ? s.entities.map(e => {
            const p1 = String(e.player1 || '').trim();
            const p2 = String(e.player2 || '').trim();
            const teamName = String(e.teamName || '').trim();
            let displayName = String(e.name || '').trim();
            if (!displayName) {
              displayName = teamName || (p1 && p2 ? `${p1} / ${p2}` : 'Peserta');
            }
            return {
              id: String(e.id || generateId()),
              name: displayName,
              teamName,
              player1: p1,
              player2: p2,
              isLeft: Boolean(e.isLeft),
              createdAt: Number(e.createdAt || Date.now()),
            };
          })
        : [];

      const normalizeTeamIds = (arr) => {
        if (!Array.isArray(arr)) return [];
        return arr.map(item => (typeof item === 'string' ? item : String(item?.id || ''))).filter(Boolean);
      };

      const activeMatches = Array.isArray(s.activeMatches)
        ? s.activeMatches.map(m => {
            const sc = [1, 2, 3].includes(Number(m.setCount)) ? Number(m.setCount) : setCount;
            const scores = Array.isArray(m.scores)
              ? m.scores.map(x => ({ a: x?.a === 0 || x?.a ? String(x.a) : '', b: x?.b === 0 || x?.b ? String(x.b) : '' }))
              : Array.from({ length: sc }, () => ({ a: '', b: '' }));
            while (scores.length < sc) scores.push({ a: '', b: '' });
            return {
              id: String(m.id || generateId()),
              matchNumber: Number(m.matchNumber || 1),
              court: String(m.court || 'Court 1'),
              mode: VALID_MODES.includes(m.mode) ? m.mode : mode,
              setCount: sc,
              targetScore: Math.max(5, Math.min(99, parseInt(m.targetScore, 10) || targetScore)),
              deuceEnabled: m.deuceEnabled !== undefined ? Boolean(m.deuceEnabled) : deuceEnabled,
              teamA: normalizeTeamIds(m.teamA),
              teamB: normalizeTeamIds(m.teamB),
              scores,
              startTime: Number(m.startTime || Date.now()),
            };
          })
        : [];

      const matchHistory = Array.isArray(s.matchHistory)
        ? s.matchHistory.map(m => {
            const sc = [1, 2, 3].includes(Number(m.setCount))
              ? Number(m.setCount)
              : (Array.isArray(m.sets) ? Math.min(3, Math.max(1, m.sets.length)) : setCount);
            const sets = Array.isArray(m.sets)
              ? m.sets.map(x => ({ a: Number(x?.a || 0), b: Number(x?.b || 0) }))
              : [];
            return {
              id: String(m.id || generateId()),
              matchNumber: Number(m.matchNumber || 1),
              court: String(m.court || 'Court 1'),
              mode: VALID_MODES.includes(m.mode) ? m.mode : mode,
              setCount: sc,
              targetScore: Math.max(5, Math.min(99, parseInt(m.targetScore, 10) || targetScore)),
              deuceEnabled: m.deuceEnabled !== undefined ? Boolean(m.deuceEnabled) : deuceEnabled,
              teamA: normalizeTeamIds(m.teamA),
              teamB: normalizeTeamIds(m.teamB),
              sets,
              startTime: Number(m.startTime || Date.now()),
              endTime: Number(m.endTime || m.startTime || Date.now()),
            };
          })
        : [];

      const maxNum = Math.max(
        0,
        ...activeMatches.map(m => m.matchNumber),
        ...matchHistory.map(m => m.matchNumber)
      );

      return {
        settings: { mode, maxMatches, setCount, targetScore, deuceEnabled },
        entities,
        activeMatches,
        matchHistory,
        matchCounter: Math.max(Number(s.matchCounter || 1), maxNum + 1),
        updatedAt: Number(s.updatedAt || Date.now()),
      };
    }

    function loadLocalMirror(roomId = currentRoomId) {
      try {
        const raw = localStorage.getItem(getLocalStorageKey(roomId));
        if (raw) {
          state = sanitizeState(JSON.parse(raw));
          return true;
        }
      } catch (err) {
        console.warn('Gagal membaca localStorage:', err);
      }
      state = {
        settings: { ...DEFAULT_SETTINGS },
        entities: [],
        activeMatches: [],
        matchHistory: [],
        matchCounter: 1,
        updatedAt: 0,
      };
      return false;
    }

    function saveLocalMirror() {
      try {
        localStorage.setItem('mabar_badminton_room_code', currentRoomId);
        localStorage.setItem(getLocalStorageKey(currentRoomId), JSON.stringify(state));
      } catch (err) {
        console.warn('Gagal menyimpan localStorage:', err);
      }
    }

      if (roomLabel) roomLabel.textContent = currentRoomId;
      if (!badge) return;

      const map = {

          dot: 'bg-[#059669] shadow-[0_0_8px_rgba(5,150,105,0.65)]',
          text: 'Cloud Online',
          cls: 'text-[#047857]'
        },

        },

    function persistState(skipCloudPush = false) {
      if (!skipCloudPush) {
        state.updatedAt = Date.now();
      }
      saveLocalMirror();

      if (!skipCloudPush && firebaseReady && currentUser && db) {
        cloudSyncStatus = 'syncing';
        updateCloudBadgeUI();
        clearTimeout(syncTimer);
        syncTimer = setTimeout(async () => {
          if (!firebaseReady || !currentUser || !db) return;
          try {
            const roomDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'mabar_rooms', currentRoomId);
            await setDoc(roomDocRef, {
              ...state,
              roomId: currentRoomId,
              lastUpdatedBy: currentUser.uid,
            });
            cloudSyncStatus = 'online';
            updateCloudBadgeUI();
          } catch (err) {
            console.error('Firebase sync error:', err);
            cloudSyncStatus = 'offline';
            updateCloudBadgeUI();
          }
        }, 250);
      }
    }

    async function initFirebaseCloud() {
      updateCloudBadgeUI();
      if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
        cloudSyncStatus = 'offline';
        updateCloudBadgeUI();
        return;
      }

      try {
        const app = initializeApp(FIREBASE_CONFIG);
        auth = getAuth(app);
        db = getFirestore(app);

        // Auth FIRST before any Firestore operation
        if (INITIAL_AUTH_TOKEN) {
          const cred = await signInWithCustomToken(auth, INITIAL_AUTH_TOKEN);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }

        if (!currentUser) {
          cloudSyncStatus = 'offline';
          updateCloudBadgeUI();
          return;
        }

        firebaseReady = true;
        subscribeToCloudRoom(currentRoomId);
      } catch (err) {
        console.error('Firebase init failed, fallback to localStorage:', err);
        firebaseReady = false;
        cloudSyncStatus = 'offline';
        updateCloudBadgeUI();
      }
    }

    function subscribeToCloudRoom(roomId) {
      if (unsubscribeRoom) {
        unsubscribeRoom();
        unsubscribeRoom = null;
      }
      if (!firebaseReady || !currentUser || !db) return;

      cloudSyncStatus = 'connecting';
      updateCloudBadgeUI();

      // Strict public data path: /artifacts/{appId}/public/data/mabar_rooms/{roomId}
      const roomDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'mabar_rooms', roomId);

      unsubscribeRoom = onSnapshot(
        roomDocRef,
        (snap) => {
          cloudSyncStatus = 'online';
          updateCloudBadgeUI();

          if (snap.exists()) {
            const remote = snap.data();
            const remoteUpdatedAt = Number(remote?.updatedAt || 0);
            const hasLocalData = state.entities.length > 0 || state.matchHistory.length > 0 || state.activeMatches.length > 0;

            if (remoteUpdatedAt > state.updatedAt || (!hasLocalData && remote)) {
              state = sanitizeState(remote);
              saveLocalMirror();
              renderAll();
            }
          } else {
            if (state.entities.length > 0 || state.matchHistory.length > 0 || state.activeMatches.length > 0) {
              persistState(false);
            }
          }
        },
        (error) => {
          console.error('Firestore onSnapshot error:', error);
          cloudSyncStatus = 'offline';
          updateCloudBadgeUI();
        }
      );
    }

    // =========================================================================
    // 4. SET VALIDATION & MATCH SCORING ENGINE
    // =========================================================================
    function validateSetScore(rawA, rawB, targetScore, deuceEnabled, allowDrawForSingleSet = false) {
      if (rawA === '' || rawB === '' || rawA === null || rawB === null || rawA === undefined || rawB === undefined) {
        return { valid: false, complete: false, winner: null, reason: 'Belum diisi' };
      }
      const a = Number(rawA);
      const b = Number(rawB);
      if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0) {
        return { valid: false, complete: true, winner: null, reason: 'Skor harus angka bulat positif' };
      }
      if (a === b) {
        if (allowDrawForSingleSet && !deuceEnabled && a > 0) {
          return { valid: true, complete: true, winner: 'D', a, b, reason: `Sah (Seri ${a}-${b})` };
        }
        return { valid: false, complete: true, winner: null, reason: 'Skor dalam 1 set tidak boleh seri' };
      }

      const max = Math.max(a, b);
      const min = Math.min(a, b);
      const diff = max - min;
      const winner = a > b ? 'A' : 'B';

      if (!deuceEnabled) {
        if (max === targetScore && min < targetScore) {
          return { valid: true, complete: true, winner, a, b, reason: `Sah (Target ${targetScore}, Deuce OFF)` };
        }
        return {
          valid: false,
          complete: true,
          winner: null,
          reason: `Deuce OFF: Pemenang set harus tepat ${targetScore} poin (misal ${targetScore}-${Math.min(min, targetScore - 1)})`
        };
      }

      // Deuce ON: wajib unggul 2 poin mulai (target-1)-(target-1), cap = 30 untuk target 21 atau target + 9
      const cap = targetScore === 21 ? 30 : Math.min(99, targetScore + 9);
      if (max < targetScore) {
        return {
          valid: false,
          complete: true,
          winner: null,
          reason: `Belum mencapai target ${targetScore} poin`
        };
      }
      if (max === targetScore) {
        if (min <= targetScore - 2) {
          return { valid: true, complete: true, winner, a, b, reason: `Sah (Target ${targetScore})` };
        }
        return {
          valid: false,
          complete: true,
          winner: null,
          reason: `Deuce ON: Mulai ${targetScore - 1}-${targetScore - 1} harus unggul 2 poin (maks ${cap})`
        };
      }
      if (max > targetScore && max < cap) {
        if (diff === 2 && min >= targetScore - 1) {
          return { valid: true, complete: true, winner, a, b, reason: `Sah (Menang Deuce ${max}-${min})` };
        }
        return {
          valid: false,
          complete: true,
          winner: null,
          reason: `Skor deuce harus unggul tepat 2 poin (misal ${min + 2}-${min}, maks ${cap})`
        };
      }
      if (max === cap) {
        if (min === cap - 1 || min === cap - 2) {
          return { valid: true, complete: true, winner, a, b, reason: `Sah (Batas Maksimal Deuce ${cap})` };
        }
        return {
          valid: false,
          complete: true,
          winner: null,
          reason: `Skor cap ${cap} hanya sah pada ${cap}-${cap - 2} atau ${cap}-${cap - 1}`
        };
      }
      return {
        valid: false,
        complete: true,
        winner: null,
        reason: `Melebihi batas maksimal deuce (${cap} poin)`
      };
    }

    function evaluateMatchScores(rawSets, setCount, targetScore, deuceEnabled) {
      const sCount = [1, 2, 3].includes(Number(setCount)) ? Number(setCount) : 2;
      const setResults = [];
      let setsWonA = 0;
      let setsWonB = 0;
      let totalA = 0;
      let totalB = 0;
      let needsSet3 = false;
      let isValidMatch = true;
      let firstError = '';

      if (sCount === 1) {
        const r1 = validateSetScore(rawSets[0]?.a, rawSets[0]?.b, targetScore, deuceEnabled, true);
        setResults.push({ ...r1, setNum: 1, skipped: false });
        if (!r1.valid) {
          isValidMatch = false;
          firstError = `Set 1: ${r1.reason}`;
        } else {
          totalA = r1.a;
          totalB = r1.b;
          if (r1.winner === 'A') setsWonA = 1;
          else if (r1.winner === 'B') setsWonB = 1;
        }
      } else if (sCount === 2) {
        for (let i = 0; i < 2; i++) {
          const r = validateSetScore(rawSets[i]?.a, rawSets[i]?.b, targetScore, deuceEnabled, false);
          setResults.push({ ...r, setNum: i + 1, skipped: false });
          if (!r.valid) {
            isValidMatch = false;
            if (!firstError) firstError = `Set ${i + 1}: ${r.reason}`;
          } else {
            totalA += r.a;
            totalB += r.b;
            if (r.winner === 'A') setsWonA++;
            else setsWonB++;
          }
        }
      } else {
        // 3 Set (Best of 3)
        const r1 = validateSetScore(rawSets[0]?.a, rawSets[0]?.b, targetScore, deuceEnabled, false);
        const r2 = validateSetScore(rawSets[1]?.a, rawSets[1]?.b, targetScore, deuceEnabled, false);
        setResults.push({ ...r1, setNum: 1, skipped: false });
        setResults.push({ ...r2, setNum: 2, skipped: false });

        if (r1.valid) {
          totalA += r1.a;
          totalB += r1.b;
          if (r1.winner === 'A') setsWonA++;
          else setsWonB++;
        } else {
          isValidMatch = false;
          firstError = `Set 1: ${r1.reason}`;
        }

        if (r2.valid) {
          totalA += r2.a;
          totalB += r2.b;
          if (r2.winner === 'A') setsWonA++;
          else setsWonB++;
        } else {
          isValidMatch = false;
          if (!firstError) firstError = `Set 2: ${r2.reason}`;
        }

        if (r1.valid && r2.valid) {
          if (setsWonA === 2 || setsWonB === 2) {
            needsSet3 = false;
            setResults.push({ valid: true, complete: false, winner: null, setNum: 3, skipped: true, reason: 'Tidak diperlukan (Menang 2-0)' });
          } else {
            needsSet3 = true;
            const r3 = validateSetScore(rawSets[2]?.a, rawSets[2]?.b, targetScore, deuceEnabled, false);
            setResults.push({ ...r3, setNum: 3, skipped: false });
            if (r3.valid) {
              totalA += r3.a;
              totalB += r3.b;
              if (r3.winner === 'A') setsWonA++;
              else setsWonB++;
            } else {
              isValidMatch = false;
              if (!firstError) firstError = `Set 3: ${r3.reason}`;
            }
          }
        } else {
          needsSet3 = false;
          setResults.push({ valid: false, complete: false, winner: null, setNum: 3, skipped: true, reason: 'Menunggu hasil Set 1 & 2' });
        }
      }

      let winner = null;
      if (isValidMatch) {
        if (sCount === 3) {
          winner = setsWonA > setsWonB ? 'A' : setsWonB > setsWonA ? 'B' : 'D';
        } else {
          winner = totalA > totalB ? 'A' : totalB > totalA ? 'B' : 'D';
        }
      }

      return {
        isValidMatch,
        firstError,
        setResults,
        setsWonA,
        setsWonB,
        totalA,
        totalB,
        needsSet3,
        winner,
      };
    }

    // =========================================================================
    // 5. CORE ENGINE: recalculateStats() — DYNAMIC WILDCARD & LEADERBOARD
    // =========================================================================
    function recalculateStats() {
      const maxMatches = state.settings.maxMatches;
      const entityMap = new Map();
      const statsMap = new Map();

      state.entities.forEach(ent => {
        entityMap.set(ent.id, ent);
        statsMap.set(ent.id, {
          entity: ent,
          regularPlayed: 0,
          inProgressRegular: 0,
          wildcardPlayed: 0,
          inProgressWildcard: 0,
          completedCount: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          pf: 0,
          pa: 0,
          pd: 0,
          isPlaying: false,
          status: 'available', // 'available' | 'playing' | 'finished' | 'left'
          lastPartners: new Set(),
          lastOpponents: new Set(),
        });
      });

      // 1. Replay matchHistory secara kronologis dari awal (oldest -> newest)
      const chronologicalHistory = [...state.matchHistory].sort((a, b) => {
        if (a.startTime !== b.startTime) return a.startTime - b.startTime;
        if (a.matchNumber !== b.matchNumber) return a.matchNumber - b.matchNumber;
        return a.id.localeCompare(b.id);
      });

      const computedHistoryMap = new Map();

      chronologicalHistory.forEach(match => {
        const sets = Array.isArray(match.sets) ? match.sets : [];
        let totalA = 0;
        let totalB = 0;
        let setsWonA = 0;
        let setsWonB = 0;

        sets.forEach(s => {
          const sa = Number(s.a || 0);
          const sb = Number(s.b || 0);
          totalA += sa;
          totalB += sb;
          if (sa > sb) setsWonA++;
          else if (sb > sa) setsWonB++;
        });

        let winner = 'D';
        if (match.setCount === 3) {
          if (setsWonA > setsWonB) winner = 'A';
          else if (setsWonB > setsWonA) winner = 'B';
          else winner = totalA > totalB ? 'A' : totalB > totalA ? 'B' : 'D';
        } else {
          if (totalA > totalB) winner = 'A';
          else if (totalB > totalA) winner = 'B';
          else winner = 'D';
        }

        const evalHistSlot = (id, teamSide) => {
          const st = statsMap.get(id);
          const ent = entityMap.get(id);
          let isWildcard = false;
          if (st) {
            if (st.regularPlayed < maxMatches) {
              isWildcard = false;
              st.regularPlayed += 1;
              st.pf += (teamSide === 'A' ? totalA : totalB);
              st.pa += (teamSide === 'A' ? totalB : totalA);
              if (winner === teamSide) st.wins += 1;
              else if (winner === 'D') st.draws += 1;
              else st.losses += 1;
            } else {
              isWildcard = true;
              st.wildcardPlayed += 1;
            }
            st.completedCount += 1;
          }
          return {
            id,
            name: ent ? ent.name : 'Peserta Dihapus',
            subName: ent && ent.teamName && ent.player1 && ent.player2 ? `${ent.player1} / ${ent.player2}` : '',
            isWildcard,
          };
        };

        const teamASlots = (match.teamA || []).map(id => evalHistSlot(id, 'A'));
        const teamBSlots = (match.teamB || []).map(id => evalHistSlot(id, 'B'));

        // Catat riwayat partner (Mix) & lawan untuk Smart Matchmaking
        if (match.mode === 'individual') {
          if (match.teamA.length === 2) {
            statsMap.get(match.teamA[0])?.lastPartners.add(match.teamA[1]);
            statsMap.get(match.teamA[1])?.lastPartners.add(match.teamA[0]);
          }
          if (match.teamB.length === 2) {
            statsMap.get(match.teamB[0])?.lastPartners.add(match.teamB[1]);
            statsMap.get(match.teamB[1])?.lastPartners.add(match.teamB[0]);
          }
        }
        (match.teamA || []).forEach(idA => {
          (match.teamB || []).forEach(idB => {
            statsMap.get(idA)?.lastOpponents.add(idB);
            statsMap.get(idB)?.lastOpponents.add(idA);
          });
        });

        computedHistoryMap.set(match.id, {
          ...match,
          teamASlots,
          teamBSlots,
          totalA,
          totalB,
          setsWonA,
          setsWonB,
          winner,
        });
      });

      // 2. Proses activeMatches secara kronologis
      const chronologicalActive = [...state.activeMatches].sort((a, b) => {
        if (a.startTime !== b.startTime) return a.startTime - b.startTime;
        return a.matchNumber - b.matchNumber;
      });

      const computedActiveMap = new Map();

      chronologicalActive.forEach(match => {
        const evalActiveTeam = (ids) => (ids || []).map(id => {
          const st = statsMap.get(id);
          const ent = entityMap.get(id);
          let isWildcard = false;
          if (st) {
            st.isPlaying = true;
            if ((st.regularPlayed + st.inProgressRegular) < maxMatches) {
              isWildcard = false;
              st.inProgressRegular += 1;
            } else {
              isWildcard = true;
              st.inProgressWildcard += 1;
            }
          }
          return {
            id,
            name: ent ? ent.name : 'Peserta',
            subName: ent && ent.teamName && ent.player1 && ent.player2 ? `${ent.player1} / ${ent.player2}` : '',
            isWildcard,
          };
        });

        computedActiveMap.set(match.id, {
          ...match,
          teamASlots: evalActiveTeam(match.teamA),
          teamBSlots: evalActiveTeam(match.teamB),
        });
      });

      // 3. Hitung PD dan status akhir tiap entitas
      let countAvailable = 0;
      let countPlaying = 0;
      let countFinished = 0;
      let countLeft = 0;

      statsMap.forEach(st => {
        st.pd = st.pf - st.pa;
        if (st.isPlaying) {
          st.status = 'playing';
          countPlaying++;
        } else if (st.entity.isLeft) {
          st.status = 'left';
          countLeft++;
        } else if (st.regularPlayed >= maxMatches) {
          st.status = 'finished';
          countFinished++;
        } else {
          st.status = 'available';
          countAvailable++;
        }
      });

      // 4. Urutkan Klasemen (1. Menang W, 2. Selisih PD, 3. Total Poin Masuk PF)
      const leaderboard = Array.from(statsMap.values()).sort((a, b) => {
        if (b.wins !== a.wins) return b.wins - a.wins;
        if (b.pd !== a.pd) return b.pd - a.pd;
        if (b.pf !== a.pf) return b.pf - a.pf;
        return a.entity.name.localeCompare(b.entity.name, 'id');
      });

      const historyNewestFirst = [...state.matchHistory]
        .sort((a, b) => {
          if (b.endTime !== a.endTime) return b.endTime - a.endTime;
          return b.matchNumber - a.matchNumber;
        })
        .map(m => computedHistoryMap.get(m.id));

      const activeList = state.activeMatches.map(m => computedActiveMap.get(m.id));

      return {
        statsMap,
        leaderboard,
        historyNewestFirst,
        activeList,
        counts: {
          total: state.entities.length,
          available: countAvailable,
          playing: countPlaying,
          finished: countFinished,
          left: countLeft,
        }
      };
    }

    function getSuggestedCourtName() {
      const usedCourts = new Set(state.activeMatches.map(m => m.court.trim().toLowerCase()));
      for (let i = 1; i <= 20; i++) {
        const candidate = `Court ${i}`;
        if (!usedCourts.has(candidate.toLowerCase())) {
          return candidate;
        }
      }
      return `Court ${state.activeMatches.length + 1}`;
    }

    // =========================================================================
    // 6. INLINE SETTINGS CONTROLLERS (NO POPUP MODAL)

    window.switchGameMode = function (newMode) {

        'info'
      );
    };

    // =========================================================================
    // 7. SMART MATCHMAKING ALGORITHM (STAGING DRAFT — INDIVIDUAL, PAIR & SINGLE)
    // =========================================================================
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getEntityRating(st) {
      return (st.wins * 100) + (st.pd * 2) + (st.pf * 0.15);
    }

    window.generateSmartAutoMatch = function () {
      const derived = recalculateStats();
      const meta = getModeMeta();
      const requiredSlots = meta.requiredSlots;
      const isOnePerSide = meta.perSide === 1;

      const availableList = Array.from(derived.statsMap.values()).filter(st => st.status === 'available');
      const finishedList = Array.from(derived.statsMap.values()).filter(st => st.status === 'finished');

      if (availableList.length === 0 && !uiState.allowWildcard) {
        showToast(`Tidak ada ${meta.entityNounLower} Tersedia. Aktifkan toggle Wildcard jika ingin bermain tambahan.`, 'warning');
        return;
      }

      let chosen = [];

      if (availableList.length >= requiredSlots) {
        // Kelompokkan berdasarkan jumlah main reguler paling sedikit (0 < 1 < 2 ...)
        const buckets = new Map();
        availableList.forEach(st => {
          const key = st.regularPlayed;
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(st);
        });
        const sortedCounts = Array.from(buckets.keys()).sort((a, b) => a - b);

        for (const cnt of sortedCounts) {
          const group = buckets.get(cnt);
          const remainingNeed = requiredSlots - chosen.length;
          if (remainingNeed <= 0) break;

          if (group.length <= remainingNeed) {
            chosen.push(...shuffleArray(group));
          } else {
            const hasPoints = group.some(st => st.completedCount > 0);
            if (!hasPoints) {
              chosen.push(...shuffleArray(group).slice(0, remainingNeed));
            } else {
              const shuffled = shuffleArray(group);
              const anchor = shuffled[0];
              const anchorRating = getEntityRating(anchor);
              const restScored = shuffled.slice(1).map(st => {
                let penalty = Math.abs(getEntityRating(st) - anchorRating) + (Math.random() * 48);
                if (isOnePerSide && anchor.lastOpponents.has(st.entity.id)) {
                  penalty += 65; // Hindari rematch berulang bila masih ada lawan lain
                }
                const pairSig = [anchor.entity.id, st.entity.id].sort().join('VS');
                if (isOnePerSide && pairSig === uiState.lastAutoSignature) {
                  penalty += 80;
                }
                return { st, penalty };
              }).sort((a, b) => a.penalty - b.penalty);

              chosen.push(anchor, ...restScored.slice(0, remainingNeed - 1).map(x => x.st));
            }
          }
        }
      } else {
        if (!uiState.allowWildcard) {
          showToast(
            `${meta.entityNoun} Tersedia tinggal ${availableList.length} (butuh ${requiredSlots}). Aktifkan toggle Wildcard terlebih dahulu!`,
            'warning'
          );
          return;
        }
        const totalPool = availableList.length + finishedList.length;
        if (totalPool < requiredSlots) {
          showToast(
            `Total ${meta.entityNounLower} siap (Tersedia + Selesai) baru ${totalPool}, belum cukup untuk ${requiredSlots} slot.`,
            'error'
          );
          return;
        }

        // WAJIB masukkan seluruh entitas Tersedia terlebih dahulu
        chosen.push(...shuffleArray(availableList));

        // Lengkapi slot yang kurang secara acak dari Selesai (prioritas wildcardPlayed paling sedikit)
        const needWildcard = requiredSlots - chosen.length;
        const wcSorted = shuffleArray(finishedList).sort((a, b) => a.wildcardPlayed - b.wildcardPlayed);
        chosen.push(...wcSorted.slice(0, needWildcard));
      }

      let teamA = [];
      let teamB = [];
      const anyPlayed = chosen.some(st => st.completedCount > 0);

      if (isOnePerSide) {
        const shuffledTwo = shuffleArray(chosen);
        teamA = [shuffledTwo[0].entity.id];
        teamB = [shuffledTwo[1].entity.id];
        uiState.lastAutoSignature = [teamA[0], teamB[0]].sort().join('VS');
      } else {
        if (!anyPlayed) {
          const s = shuffleArray(chosen);
          teamA = [s[0].entity.id, s[1].entity.id];
          teamB = [s[2].entity.id, s[3].entity.id];
          uiState.lastAutoSignature = [
            [teamA[0], teamA[1]].sort().join('+'),
            [teamB[0], teamB[1]].sort().join('+')
          ].sort().join('VS');
        } else {
          const combos = [
            { a: [chosen[0], chosen[1]], b: [chosen[2], chosen[3]] },
            { a: [chosen[0], chosen[2]], b: [chosen[1], chosen[3]] },
            { a: [chosen[0], chosen[3]], b: [chosen[1], chosen[2]] },
          ];

          const scoredCombos = combos.map(c => {
            const sumA = getEntityRating(c.a[0]) + getEntityRating(c.a[1]);
            const sumB = getEntityRating(c.b[0]) + getEntityRating(c.b[1]);
            let penalty = Math.abs(sumA - sumB);
            if (c.a[0].lastPartners.has(c.a[1].entity.id)) penalty += 38;
            if (c.b[0].lastPartners.has(c.b[1].entity.id)) penalty += 38;
            penalty += Math.random() * 26;

            const sig = [
              [c.a[0].entity.id, c.a[1].entity.id].sort().join('+'),
              [c.b[0].entity.id, c.b[1].entity.id].sort().join('+')
            ].sort().join('VS');

            if (sig === uiState.lastAutoSignature) penalty += 65;

            return { c, penalty, sig };
          }).sort((x, y) => x.penalty - y.penalty);

          const best = scoredCombos[0];
          uiState.lastAutoSignature = best.sig;
          teamA = best.c.a.map(x => x.entity.id);
          teamB = best.c.b.map(x => x.entity.id);
        }
      }

      const prevCourt = uiState.draftMatch?.court;
      uiState.draftMatch = {
        teamA,
        teamB,
        court: prevCourt || getSuggestedCourtName(),
        source: 'auto',
      };

      renderAll();
      showToast(
        anyPlayed
          ? 'Draft match seimbang berdasarkan klasemen siap! Klik "Acak Ulang" atau "Mulai Match".'
          : 'Draft match acak siap! Periksa susunan lalu klik "Mulai Match (Start)".',
        'info'
      );
    };

    window.handleManualSlotChange = function (slotKey, value) {
      uiState.manualSlots[slotKey] = value;

      const meta = getModeMeta();
      const isOnePerSide = meta.perSide === 1;
      const slots = isOnePerSide
        ? [uiState.manualSlots.a1, uiState.manualSlots.b1]
        : [uiState.manualSlots.a1, uiState.manualSlots.a2, uiState.manualSlots.b1, uiState.manualSlots.b2];

      const filled = slots.filter(Boolean);
      if (new Set(filled).size !== filled.length) {
        uiState.manualSlots[slotKey] = '';
        showToast(`${meta.entityNoun} yang sama tidak boleh dipilih di lebih dari 1 slot!`, 'error');
        renderAll();
        return;
      }

      if (filled.length === slots.length) {
        uiState.draftMatch = {
          teamA: isOnePerSide ? [uiState.manualSlots.a1] : [uiState.manualSlots.a1, uiState.manualSlots.a2],
          teamB: isOnePerSide ? [uiState.manualSlots.b1] : [uiState.manualSlots.b1, uiState.manualSlots.b2],
          court: uiState.draftMatch?.court || getSuggestedCourtName(),
          source: 'manual',
        };
      } else if (uiState.draftMatch && uiState.draftMatch.source === 'manual') {
        uiState.draftMatch = null;
      }

      renderAll();
    };

    window.updateDraftCourt = function (val) {
      if (uiState.draftMatch) {
        uiState.draftMatch.court = val;
      }
    };

    window.clearDraftMatch = function () {
      uiState.draftMatch = null;
      uiState.manualSlots = { a1: '', a2: '', b1: '', b2: '' };
      renderAll();
    };

    window.startDraftMatch = function () {
      if (!uiState.draftMatch) {
        showToast('Belum ada draft pertandingan. Silakan Acak Otomatis atau Pilih Manual dulu.', 'warning');
        return;
      }

      const derived = recalculateStats();
      const allIds = [...uiState.draftMatch.teamA, ...uiState.draftMatch.teamB];

      if (new Set(allIds).size !== allIds.length) {
        showToast('Terdapat peserta ganda dalam satu match!', 'error');
        return;
      }

      for (const id of allIds) {
        const st = derived.statsMap.get(id);
        if (!st) {
          showToast('Salah satu peserta sudah tidak ada. Silakan buat ulang draft.', 'error');
          uiState.draftMatch = null;
          renderAll();
          return;
        }
        if (st.status === 'playing') {
          showToast(`"${st.entity.name}" sedang bermain di lapangan lain!`, 'error');
          return;
        }
        if (st.status === 'left') {
          showToast(`"${st.entity.name}" sudah pulang / non-aktif!`, 'error');
          return;
        }
        if (st.status === 'finished' && !uiState.allowWildcard) {
          showToast(`"${st.entity.name}" sudah selesai kuota. Aktifkan Wildcard terlebih dahulu.`, 'warning');
          return;
        }
      }

      const courtName = (uiState.draftMatch.court || '').trim() || getSuggestedCourtName();
      const setCount = state.settings.setCount;
      const newMatch = {
        id: generateId(),
        matchNumber: state.matchCounter++,
        court: courtName,
        mode: state.settings.mode,
        setCount,
        targetScore: state.settings.targetScore,
        deuceEnabled: state.settings.deuceEnabled,
        teamA: [...uiState.draftMatch.teamA],
        teamB: [...uiState.draftMatch.teamB],
        scores: Array.from({ length: setCount }, () => ({ a: '', b: '' })),
        startTime: Date.now(),
      };

      state.activeMatches.push(newMatch);
      uiState.draftMatch = null;
      uiState.manualSlots = { a1: '', a2: '', b1: '', b2: '' };

      persistState();
      renderAll();
      showToast(`Match #${newMatch.matchNumber} (${newMatch.court}) dimulai pukul ${formatClock(newMatch.startTime, true)}!`, 'success');
    };

    // =========================================================================
    // 8. ACTIVE MATCH QUICK SCORE CONTROLS (-, +, TARGET) & SUBMIT
    // =========================================================================
    window.handleActiveScoreInput = function (matchId, setIndex, side, value) {
      const match = state.activeMatches.find(m => m.id === matchId);
      if (!match) return;
      const cleaned = value === '' ? '' : String(Math.max(0, Math.min(99, parseInt(value, 10) || 0)));
      if (!match.scores[setIndex]) match.scores[setIndex] = { a: '', b: '' };
      match.scores[setIndex][side] = cleaned;

      updateActiveMatchLiveUI(matchId);
      persistState();
    };

    window.stepActiveScore = function (matchId, setIndex, side, delta) {
      const match = state.activeMatches.find(m => m.id === matchId);
      if (!match) return;
      if (!match.scores[setIndex]) match.scores[setIndex] = { a: '', b: '' };
      const curRaw = match.scores[setIndex][side];
      const curNum = curRaw === '' ? 0 : (parseInt(curRaw, 10) || 0);
      const nextNum = Math.max(0, Math.min(99, curNum + delta));
      match.scores[setIndex][side] = String(nextNum);

      const inputEl = document.getElementById(`active-score-input-${matchId}-${setIndex}-${side}`);
      if (inputEl) inputEl.value = String(nextNum);

      updateActiveMatchLiveUI(matchId);
      persistState();
    };

    window.setQuickTargetActiveScore = function (matchId, setIndex, side) {
      const match = state.activeMatches.find(m => m.id === matchId);
      if (!match) return;
      if (!match.scores[setIndex]) match.scores[setIndex] = { a: '', b: '' };
      const targetVal = String(match.targetScore || 21);
      match.scores[setIndex][side] = targetVal;

      const inputEl = document.getElementById(`active-score-input-${matchId}-${setIndex}-${side}`);
      if (inputEl) inputEl.value = targetVal;

      updateActiveMatchLiveUI(matchId);
      persistState();
    };

    function updateActiveMatchLiveUI(matchId) {
      const match = state.activeMatches.find(m => m.id === matchId);
      if (!match) return;

      const mMeta = getModeMeta(match.mode);
      const evalRes = evaluateMatchScores(match.scores, match.setCount, match.targetScore, match.deuceEnabled);

      evalRes.setResults.forEach((sr, idx) => {
        const hintEl = document.getElementById(`active-set-hint-${matchId}-${idx}`);
        if (hintEl) {
          if (sr.skipped) {
            hintEl.textContent = sr.reason;
            hintEl.className = 'text-[11px] font-semibold text-slate-400 text-right';
          } else if (!sr.complete) {
            hintEl.textContent = `Target ${match.targetScore} (${match.deuceEnabled ? 'Deuce ON' : 'Deuce OFF'})`;
            hintEl.className = 'text-[11px] font-medium text-slate-500 text-right';
          } else if (sr.valid) {
            const sideWin = sr.winner === 'A' ? mMeta.sideALabel : mMeta.sideBLabel;
            hintEl.textContent = sr.winner === 'D' ? `✓ Set ${idx + 1} Seri` : `✓ ${sideWin} Menang Set ${idx + 1}`;
            hintEl.className = 'text-[11px] font-bold text-[#047857] text-right';
          } else {
            hintEl.textContent = `⚠ ${sr.reason}`;
            hintEl.className = 'text-[11px] font-bold text-amber-700 text-right';
          }
        }
      });

      const set3Row = document.getElementById(`active-set3-row-${matchId}`);
      const bestOf3Banner = document.getElementById(`active-bo3-banner-${matchId}`);
      if (match.setCount === 3) {
        if (set3Row) {
          if (evalRes.needsSet3) set3Row.classList.remove('hidden');
          else set3Row.classList.add('hidden');
        }
        if (bestOf3Banner) {
          if (evalRes.setsWonA === 2 || evalRes.setsWonB === 2) {
            const winSide = evalRes.setsWonA === 2 ? mMeta.sideALabel : mMeta.sideBLabel;
            bestOf3Banner.classList.remove('hidden');
            bestOf3Banner.textContent = `Match Selesai (2-0) — ${winSide} Menang! Set 3 tidak diperlukan.`;
          } else if (evalRes.needsSet3) {
            bestOf3Banner.classList.remove('hidden');
            bestOf3Banner.textContent = `Kedudukan Set 1-1! Rubber Set (Set 3) otomatis dibuka.`;
          } else {
            bestOf3Banner.classList.add('hidden');
          }
        }
      }

      const previewEl = document.getElementById(`active-match-preview-${matchId}`);
      if (previewEl) {
        if (evalRes.isValidMatch) {
          const winText = evalRes.winner === 'A'
            ? `${mMeta.sideALabel} Menang`
            : evalRes.winner === 'B'
              ? `${mMeta.sideBLabel} Menang`
              : 'Hasil Seri (Draw)';
          previewEl.className = 'text-xs font-bold text-[#047857] bg-emerald-50 border border-emerald-200 rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2';
          previewEl.innerHTML = `
            <span>✓ Siap Disimpan: ${winText}</span>
            <span class="scoreboard-digits font-mono font-extrabold">Total ${evalRes.totalA} - ${evalRes.totalB}</span>
          `;
        } else {
          previewEl.className = 'text-xs font-medium text-slate-600 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2';
          previewEl.innerHTML = `
            <span>${escapeHTML(evalRes.firstError || 'Masukkan skor yang sah untuk menyelesaikan match.')}</span>
            <span class="scoreboard-digits font-mono font-bold text-slate-700">${evalRes.totalA} - ${evalRes.totalB}</span>
          `;
        }
      }
    }

    window.submitActiveMatchScore = function (matchId) {
      const idx = state.activeMatches.findIndex(m => m.id === matchId);
      if (idx === -1) return;
      const match = state.activeMatches[idx];

      const evalRes = evaluateMatchScores(match.scores, match.setCount, match.targetScore, match.deuceEnabled);
      if (!evalRes.isValidMatch) {
        showToast(`Skor belum lengkap/sah: ${evalRes.firstError}`, 'warning');
        return;
      }

      const playedSets = evalRes.setResults
        .filter(sr => !sr.skipped && sr.valid)
        .map(sr => ({ a: sr.a, b: sr.b }));

      const endTime = Date.now();
      const completedRecord = {
        id: match.id,
        matchNumber: match.matchNumber,
        court: match.court,
        mode: match.mode,
        setCount: match.setCount,
        targetScore: match.targetScore,
        deuceEnabled: match.deuceEnabled,
        teamA: [...match.teamA],
        teamB: [...match.teamB],
        sets: playedSets,
        startTime: match.startTime,
        endTime,
      };

      state.matchHistory.push(completedRecord);
      state.activeMatches.splice(idx, 1);

      persistState();
      renderAll();
      showToast(`Match #${match.matchNumber} selesai (${formatClock(endTime, true)}) & klasemen diperbarui!`, 'success');
    };

    window.confirmCancelActiveMatch = function (matchId) {
      const match = state.activeMatches.find(m => m.id === matchId);
      if (!match) return;

      showConfirmModal({
        title: `WO / Batalkan Match #${match.matchNumber} (${match.court})?`,
        message: 'Pertandingan akan dibatalkan tanpa menyimpan skor dan status seluruh pemain dikembalikan seperti semula.',
        confirmLabel: 'Ya, Batalkan Match',
        confirmStyle: 'danger',
        onConfirm: () => {
          state.activeMatches = state.activeMatches.filter(m => m.id !== matchId);
          persistState();
          renderAll();
          showToast(`Match #${match.matchNumber} dibatalkan.`, 'info');
        }
      });
    };

    // =========================================================================

    // =========================================================================
    window.handleCheckInSubmit = function (event) {
      event.preventDefault();
      const meta = getModeMeta();
      const isPair = meta.mode === 'fixed_pair';

      let name = '';
      let teamName = '';
      let player1 = '';
      let player2 = '';

      if (!isPair) {
        const input = document.getElementById('checkin-single-name');
        name = (input?.value || '').trim().replace(/\s+/g, ' ');
        if (!name) {
          showToast(`Silakan ketik nama ${meta.entityNounLower} terlebih dahulu.`, 'warning');
          input?.focus();
          return;
        }
      } else {
        const teamInput = document.getElementById('checkin-pair-team');
        const p1Input = document.getElementById('checkin-pair-p1');
        const p2Input = document.getElementById('checkin-pair-p2');

        teamName = (teamInput?.value || '').trim().replace(/\s+/g, ' ');
        player1 = (p1Input?.value || '').trim().replace(/\s+/g, ' ');
        player2 = (p2Input?.value || '').trim().replace(/\s+/g, ' ');

        if (!player1 || !player2) {
          showToast('Pemain 1 dan Pemain 2 wajib diisi!', 'warning');
          (!player1 ? p1Input : p2Input)?.focus();
          return;
        }
        if (player1.toLowerCase() === player2.toLowerCase()) {
          showToast('Nama Pemain 1 dan Pemain 2 tidak boleh sama!', 'error');
          p2Input?.focus();
          return;
        }
        name = teamName ? teamName : `${player1} / ${player2}`;
      }

      const dup = state.entities.some(e => e.name.toLowerCase() === name.toLowerCase());
      if (dup) {
        showToast(`"${name}" sudah terdaftar! Gunakan nama yang berbeda.`, 'error');
        return;
      }

      state.entities.push({
        id: generateId(),
        name,
        teamName,
        player1,
        player2,
        isLeft: false,
        createdAt: Date.now(),
      });

      persistState();
      renderAll();
      showToast(`${meta.entityNoun} "${name}" berhasil didaftarkan!`, 'success');

      setTimeout(() => {
        const nextFocus = document.getElementById(isPair ? 'checkin-pair-p1' : 'checkin-single-name');
        if (nextFocus) nextFocus.focus();
      }, 25);
    };

    window.toggleParticipantLeft = function (entityId) {
      const derived = recalculateStats();
      const st = derived.statsMap.get(entityId);
      if (!st) return;

      if (st.isPlaying) {
        showToast(`"${st.entity.name}" sedang bermain. Selesaikan atau batalkan match dulu.`, 'warning');
        return;
      }

      st.entity.isLeft = !st.entity.isLeft;

      if (st.entity.isLeft && uiState.draftMatch) {
        const inDraft = [...uiState.draftMatch.teamA, ...uiState.draftMatch.teamB].includes(entityId);
        if (inDraft) {
          uiState.draftMatch = null;
          uiState.manualSlots = { a1: '', a2: '', b1: '', b2: '' };
        }
      }

      persistState();
      renderAll();
      showToast(
        st.entity.isLeft
          ? `"${st.entity.name}" ditandai Pulang (Non-Aktif). Skor klasemen tetap utuh.`
          : `"${st.entity.name}" diaktifkan kembali dan siap bermain!`,
        'info'
      );
    };

    window.submitEditEntity = function (event, entityId) {
      event.preventDefault();
      const entity = state.entities.find(e => e.id === entityId);
      if (!entity) return;

      const p1El = document.getElementById('edit-ent-p1');
      const p2El = document.getElementById('edit-ent-p2');
      const teamEl = document.getElementById('edit-ent-team');
      const nameEl = document.getElementById('edit-ent-name');

      if (p1El && p2El) {
        const p1 = p1El.value.trim().replace(/\s+/g, ' ');
        const p2 = p2El.value.trim().replace(/\s+/g, ' ');
        const tn = (teamEl?.value || '').trim().replace(/\s+/g, ' ');
        if (!p1 || !p2) {
          showToast('Pemain 1 dan Pemain 2 wajib diisi!', 'warning');
          return;
        }
        if (p1.toLowerCase() === p2.toLowerCase()) {
          showToast('Nama Pemain 1 dan Pemain 2 tidak boleh sama!', 'error');
          return;
        }
        const newName = tn ? tn : `${p1} / ${p2}`;
        const dup = state.entities.some(e => e.id !== entityId && e.name.toLowerCase() === newName.toLowerCase());
        if (dup) {
          showToast(`Nama "${newName}" sudah dipakai pasangan lain!`, 'error');
          return;
        }
        entity.teamName = tn;
        entity.player1 = p1;
        entity.player2 = p2;
        entity.name = newName;
      } else if (nameEl) {
        const newName = nameEl.value.trim().replace(/\s+/g, ' ');
        if (!newName) {
          showToast('Nama tidak boleh kosong!', 'warning');
          return;
        }
        const dup = state.entities.some(e => e.id !== entityId && e.name.toLowerCase() === newName.toLowerCase());
        if (dup) {
          showToast(`Nama "${newName}" sudah dipakai peserta lain!`, 'error');
          return;
        }
        entity.name = newName;
      }

      window.closeModal();
      persistState();
      renderAll();
      showToast(`Nama berhasil diperbarui menjadi "${entity.name}".`, 'success');
    };

    window.confirmDeleteEntity = function (entityId) {
      const derived = recalculateStats();
      const st = derived.statsMap.get(entityId);
      if (!st) return;

      if (st.isPlaying || st.completedCount > 0) {
        showToast('Tidak dapat dihapus karena sudah/sedang bermain (gunakan tombol Pulang).', 'warning');
        return;
      }

      showConfirmModal({
        title: `Hapus "${st.entity.name}"?`,
        message: 'Data ini belum pernah bertanding dan akan dihapus permanen dari daftar hadir.',
        confirmLabel: 'Ya, Hapus',
        confirmStyle: 'danger',
        onConfirm: () => {
          state.entities = state.entities.filter(e => e.id !== entityId);
          if (uiState.draftMatch) {
            const inDraft = [...uiState.draftMatch.teamA, ...uiState.draftMatch.teamB].includes(entityId);
            if (inDraft) {
              uiState.draftMatch = null;
              uiState.manualSlots = { a1: '', a2: '', b1: '', b2: '' };
            }
          }
          persistState();
          renderAll();
          showToast(`"${st.entity.name}" dihapus dari daftar hadir.`, 'info');
        }
      });
    };

    window.stepEditHistoryScore = function (historyId, setIdx, side, delta) {
      const el = document.getElementById(`edit-hist-${side}-${setIdx}`);
      if (!el) return;
      const cur = el.value === '' ? 0 : (parseInt(el.value, 10) || 0);
      el.value = String(Math.max(0, Math.min(99, cur + delta)));
      window.refreshEditHistoryValidation(historyId);
    };

      const el = document.getElementById(`edit-hist-${side}-${setIdx}`);

      el.value = String(targetVal);
      window.refreshEditHistoryValidation(historyId);
    };

    window.refreshEditHistoryValidation = function (historyId) {
      const match = state.matchHistory.find(m => m.id === historyId);
      if (!match) return;
      const mMeta = getModeMeta(match.mode);
      const sCount = match.setCount || 2;
      const rawSets = Array.from({ length: sCount }, (_, i) => ({
        a: document.getElementById(`edit-hist-a-${i}`)?.value ?? '',
        b: document.getElementById(`edit-hist-b-${i}`)?.value ?? '',
      }));

      const evalRes = evaluateMatchScores(rawSets, sCount, match.targetScore, match.deuceEnabled);

      if (sCount === 3) {
        const row3 = document.getElementById('edit-hist-row-2');
        if (row3) {
          if (evalRes.needsSet3) row3.classList.remove('hidden');
          else row3.classList.add('hidden');
        }
      }

      evalRes.setResults.forEach((sr, i) => {
        const hintEl = document.getElementById(`edit-hist-hint-${i}`);
        if (!hintEl) return;
        if (sr.skipped) {
          hintEl.textContent = sr.reason;
          hintEl.className = 'text-[11px] text-slate-400 font-semibold';
        } else if (sr.valid) {
          const winLbl = sr.winner === 'A' ? mMeta.sideALabel : mMeta.sideBLabel;
          hintEl.textContent = sr.winner === 'D' ? `✓ Seri` : `✓ ${winLbl} Menang`;
          hintEl.className = 'text-[11px] font-bold text-[#047857]';
        } else {
          hintEl.textContent = `⚠ ${sr.reason}`;
          hintEl.className = 'text-[11px] font-bold text-amber-700';
        }
      });

      const sumEl = document.getElementById('edit-hist-summary');
      if (sumEl) {
        if (evalRes.isValidMatch) {
          const wText = evalRes.winner === 'A' ? `${mMeta.sideALabel} Menang` : evalRes.winner === 'B' ? `${mMeta.sideBLabel} Menang` : 'Seri';
          sumEl.className = 'text-xs font-bold text-[#047857] bg-emerald-50 border border-emerald-200 rounded-xl px-3.5 py-2.5 flex items-center justify-between';
          sumEl.innerHTML = `<span>✓ Skor Sah: ${wText}</span><span class="scoreboard-digits font-mono">Total ${evalRes.totalA} - ${evalRes.totalB}</span>`;
        } else {
          sumEl.className = 'text-xs font-semibold text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-3.5 py-2.5';
          sumEl.textContent = `⚠ ${evalRes.firstError}`;
        }
      }
    };

    window.submitEditHistory = function (event, historyId) {
      event.preventDefault();
      const match = state.matchHistory.find(m => m.id === historyId);
      if (!match) return;

      const sCount = match.setCount || 2;
      const rawSets = Array.from({ length: sCount }, (_, i) => ({
        a: document.getElementById(`edit-hist-a-${i}`)?.value ?? '',
        b: document.getElementById(`edit-hist-b-${i}`)?.value ?? '',
      }));

      const evalRes = evaluateMatchScores(rawSets, sCount, match.targetScore, match.deuceEnabled);
      if (!evalRes.isValidMatch) {
        showToast(`Periksa kembali skor: ${evalRes.firstError}`, 'warning');
        return;
      }

      const newCourt = (document.getElementById('edit-hist-court')?.value || '').trim() || match.court;
      match.court = newCourt;
      match.sets = evalRes.setResults.filter(sr => !sr.skipped && sr.valid).map(sr => ({ a: sr.a, b: sr.b }));

      window.closeModal();
      persistState();
      renderAll();
      showToast(`Riwayat Match #${match.matchNumber} diperbarui & seluruh klasemen dikalkulasi ulang!`, 'success');

    window.exportJSONData = function () {
      try {
        const payload = {
          app: 'Mabar Badminton Pro',
          version: 4,
          roomId: currentRoomId,
          exportedAt: new Date().toISOString(),
          data: state,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `mabar-badminton-${currentRoomId.toLowerCase()}-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File backup JSON berhasil diunduh!', 'success');
      } catch (err) {
        console.error(err);
        showToast('Gagal mengekspor data JSON.', 'error');
      }
    };

    document.getElementById('import-json-input').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          const rawData = parsed.data && Array.isArray(parsed.data.entities) ? parsed.data : parsed;
          if (!rawData || !Array.isArray(rawData.entities)) {
            throw new Error('Struktur JSON tidak valid.');
          }
          state = sanitizeState(rawData);
          uiState.draftMatch = null;
          uiState.manualSlots = { a1: '', a2: '', b1: '', b2: '' };
          persistState();
          renderAll();
          showToast(`Data dipulihkan: ${state.entities.length} peserta & ${state.matchHistory.length} riwayat match!`, 'success');
        } catch (err) {
          console.error(err);
          showToast('File JSON tidak valid atau rusak.', 'error');
        }
      };
      reader.readAsText(file);
    });

            <button

            >
